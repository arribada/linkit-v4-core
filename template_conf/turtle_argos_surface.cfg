# =====================================================================
#  Tortue marine — Argos surface, REMONTEES COURTES
# =====================================================================
#  Derive de turtle_cloudlocate.cfg. Meme principe (CloudLocate: la balise
#  capture un instantane brut, le sol calcule la position), mais reglee pour le
#  cas ou la fenetre de surface se compte en SECONDES et non en minutes.
#
#  Ce qui change par rapport a turtle_cloudlocate.cfg, et pourquoi, est marque
#  « >>> » ci-dessous. Le reste est identique et n a pas ete rediscute.
#
#  Le levier principal n est pas le recepteur: c est le PROLOGUE. Entre la
#  decision d allumer et l instant ou le M10Q ecoute reellement, le firmware
#  paie des attentes fixes et une serie d echanges UART. Comptes dans le code
#  (voir tests/src/gnss_short_window_sim_test.cpp, qui cite chaque constante):
#
#     rail coupe (GNP52=0)     : 2602 ms d attentes fixes + 21 echanges
#     reveil en place (GNP52>0) :   50 ms d attentes fixes + 15 echanges
#
#  Sur une remontee de 8 s, le premier cas consomme la moitie de la fenetre.
#
#  PREREQUIS DE DEPLOIEMENT, pas un parametre:
#  Poser l horloge ($RTCW, ou PyLinkit) AVANT de fermer le boitier. Sans
#  horloge valide, state_sendofflinedatabase abandonne (« ano_skip
#  reason=no_rtc ») et load_dbd_from_flash refuse la base persistee (« RTC not
#  set — cannot verify freshness »): l assistance, qui est le remede connu a la
#  mort du fix a deux jours, ne s applique JAMAIS. Et apres un --recover
#  nrfjprog, le magasin de configuration est efface: tout est a reposer.
#
#  SECOND PREREQUIS, la RCONF MAITRESSE (ARGOS_RADIOCONF):
#  ARGOS_ADAPTIVE_MODULATION = 0 (decision 2026-10): chaque trame part sur la
#  modulation de la maitresse, et nulle part ailleurs.
#    - MEAS20 fait 192 bits: seule une maitresse qui decode en LDA2 le porte.
#      Sur une maitresse LDK, AUCUN CloudLocate n est jamais emis: le creneau
#      repasse a une position en cache ou a un Doppler (correctif 2026-10;
#      avant, il partait vide). La balise emet, mais sans CloudLocate.
#    - La pile de profondeur ne rapporte que sur une maitresse LDA2.
#    - Le Doppler, et le Doppler de basse batterie, suivent la maitresse:
#      4 octets en LDA2, trame de 128 bits (16 octets) en LDK.
#    - ARGOS_RADIOCONF doit etre PROVISIONNEE: sa valeur d usine est VIDE, et
#      une maitresse vide fait retomber le KIM2 sur une RCONF LDK codee en dur.
#      Une balise qui n a connu que adaptive=1 n a peut-etre jamais eu sa
#      maitresse ecrite. Verifier ce qu elle decode (SATVF, cas de banc PROV-01).
#    - Sur SMD: lancer SATVF apres le provisionnement, pour que la modulation
#      relue du module soit enregistree avant le deploiement.
# =====================================================================

[PARAM]

PROFILE_NAME = TURTLE-ARGOS-SURF
DEVICE_MODEL = LinkIt-v4-KIM2

# --- Emission ---------------------------------------------------------
ARGOS_MODE = SURFACING_BURST
ARGOS_TX_REPETITION = 60
ARGOS_NTRY_PER_MESSAGE = 0
# ATTENTION: la pile ne rapporte quelque chose QUE sur une maitresse LDA2.
# En LDK chaque position coute une emission entiere. Voir "The depth pile only
# pays off on LDA2" dans le README, et le cas de banc PROV-01.
ARGOS_DEPTH_PILE = 4
ARGOS_DUTY_CYCLE = FFFFFF
ARGOS_TX_JITTER_EN = 1
# 0 = la modulation est celle de la RCONF maitresse; LDA2 requise pour la
# pile (LONG 192 b) et pour MEAS20. Voir l entete.
ARGOS_ADAPTIVE_MODULATION = 0

# --- Salve d emersion -------------------------------------------------
SURFACING_BURST_INITIAL_INTERVAL = 5
SURFACING_BURST_STEP = 10
SURFACING_BURST_MAX_INTERVAL = 60
SURFACING_BURST_MAX_MSG = 6

# --- GNSS / CloudLocate ----------------------------------------------
GNSS_ENABLE = 1
# 2 = CLOUDLOCATE. Obligatoire avec ARGOS_MODE = SURFACING_BURST, sinon
# gps_service ne pose jamais cloudlocate_enable et la capture n est pas armee.
GNSS_FASTLOC_MODE = 2
# 1 = MEAS20. AUTONOME: le sol n a besoin d aucun indice de position, et la
# datation passe par un AGE (capture -> emission) et non par une heure absolue,
# donc elle est insensible a la derive de l horloge de la balise. MEASC12 exige
# un indice de position cote sol — c est ce qui avait rendu un deploiement
# precedent muet en positions.
# MEAS20 = 192 bits = LDA2 uniquement: exige une maitresse LDA2 (voir l entete).
GNSS_CLOUDLOCATE_FORMAT = 1
# Capturer a CHAQUE emersion, pas seulement avant le premier fix.
GNSS_CLOUDLOCATE_ALWAYS = 1
# >>> 0, et c est un choix, pas un oubli.
# GNP53 termine la session des la premiere capture. La simulation de fenetres
# courtes montre qu il ne gagne AUCUNE remontee: la capture a deja eu lieu
# quand il coupe, donc le taux de capture est identique au bit pres. Ce qu il
# supprime, c est le PVT qui serait arrive plus tard dans la meme fenetre — et
# le PVT est la seule chose qui resynchronise l horloge et rafraichit la
# derniere position connue, dont dependent le choix du jour ANO et l injection
# MGA-INI-POS de toutes les sessions suivantes. Son vrai benefice est
# energetique (moins de temps recepteur allume), pas un gain de position.
# A passer a 1 seulement si le bilan d energie l impose.
GNSS_CLOUDLOCATE_ONLY = 0
GNSS_ACQ_TIMEOUT = 60
GNSS_COLD_ACQ_TIMEOUT = 90
GNSS_SESSION_SINGLE_FIX = 1
GNSS_MIN_NUM_FIXES = 1
GNSS_NTRY = 2
# >>> 7 = GPS + Galileo + GLONASS (BeiDou retire, 2026-10).
# 15 ajoutait BeiDou B1C, qui sur M10 desactive AssistNow (Online, Offline et
# Autonomous) — notes de version u-blox UBX-22001426 §3.1.4. A 15, le template
# ecrasait aussi au provisionnement le defaut firmware 0x07, et tout le travail
# d assistance restait sans effet. Le TTFF est identique d apres la datasheet.
# Bits: 0=GPS 1=GAL 2=GLO 3=BDS 4=QZSS 5=SBAS.
# Note: jusqu a ce correctif, ce parametre etait INERTE en CloudLocate — le
# masque etait force a |0x0F tant qu aucun PVT n avait eu lieu, et une balise
# CloudLocate n en produit jamais. Il agit desormais.
GNSS_CONSTELLATION_MASK = 7
GNSS_FIX_MODE = AUTO
GNSS_MIN_CNO = 10
GNSS_MIN_ELEVATION = 5
# >>> 300 m conserve (valeur par defaut). Plus l erreur d orbite admise est
# grande, plus les predictions AssistNow Autonomous restent valides longtemps
# (~10 j a 300 m) au prix de leur precision. Compromis assume: l imprecision
# d orbite est absorbee au sol par le calcul CloudLocate, alors qu une
# prediction perimee coute une acquisition entiere. A reconsiderer a 100 si les
# captures se revelent non resolubles.
GNSS_ORBIT_MAX_ERROR = 300
GNSS_ASSISTNOW_EN = 1
GNSS_ASSISTNOW_OFFLINE_EN = 1
GNSS_ANO_STALE_DAYS = 5
GNSS_TRIGGER_ON_SURFACED = 1
# >>> 0 EXPLICITE (c est aussi le defaut, mais il merite d etre ecrit ici).
# A 1, chaque emersion demande un vrai cold start: CFG-RST navBbrMask=0xFFFF,
# qui EFFACE ephemerides, almanach, position et heure du recepteur. C est
# exactement l inverse de ce que cette configuration cherche a faire.
GNSS_TRIGGER_COLD_START_ON_SURFACED = 0
# >>> LE PARAMETRE CENTRAL. 1800 s.
# Le rail GNSS reste alimente apres la session et le recepteur dort en
# PMREQ-backup: la remontee suivante le reveille par EXTINT au lieu de le
# redemarrer a froid — 2602 ms d attentes fixes et 5 echanges UART en moins.
# Sans pile V_BCKP (c est le cas de cette carte), ce rail maintenu est la SEULE
# chose qui conserve les ephemerides entre deux remontees.
#
# Pourquoi 1800 et non le sentinelle 4294967295 (« ne jamais couper »):
#   - 1800 s couvre une plongee de 30 min, au-dela de la mediane de plongee
#     modelisee (20 min), donc la grande majorite des remontees sont tiedes;
#   - mais si l animal reste en bas plus longtemps, le rail EST coupe, ce qui
#     exerce periodiquement le chemin a froid — sur un appareil scelle pour un
#     an, un chemin jamais emprunte est un chemin dont on ne sait rien;
#   - le sentinelle, lui, desarme aussi le cycle de rail prophylactique de 24 h
#     (gps_service.cpp le saute explicitement pour ce cas).
# Cout: ~46 uA de veille M10Q sur le rail (SAM-M10Q DS R05 Table 15), soit
# ~0,4 Ah/an, plus ~8 uA de reduction VSYS abandonnee pendant la fenetre de
# veille profonde (voir GPIOPins::is_gnss_rail_active). Environ 6 % d un pack
# de 7,2 Ah.
GNSS_DEEP_IDLE_AFTER_OFF_S = 1800
# Un fix de moins de 5 min est reutilise plutot que de rallumer le recepteur.
GNSS_REUSE_FIX_MAX_AGE_S = 300
# Filtres desactives: ils portent sur une position calculee a bord, qui
# n existe pas ici.
# Et sur une maitresse LDK: un filtre actif stocke un PVT degrade, que la salve
# (FASTLOC_MODE = 2 l inclut) emet en fastloc 192 bits en BASCULANT le module
# en LDA2 — bascule qui reste collee sur SMD jusqu au prochain demarrage.
GNSS_HACCFILT_ENABLE = 0
GNSS_HDOPFILT_ENABLE = 0

# --- Immersion --------------------------------------------------------
UW_ENABLE = 1
UW_DRY_TIME_BEFORE_TX = 5
MIN_SURFACE_CYCLE_INTERVAL = 0
COOLDOWN_TRIGGER_MODE = 3

# --- Batterie ---------------------------------------------------------
LB_EN = 1
LB_THRESHOLD = 15
LB_CRITICAL_THRESH = 5
LB_ARGOS_MODE = DOPPLER
LB_GNSS_EN = 0
LB_ARGOS_DEPTH_PILE = 1
LB_ARGOS_TX_REPETITION = 600

SAT_PREPASS_EN = 0
ARGOS_RX_EN = 0
RATE_LIMIT_EN = 0
LED_MODE = OFF
