# =====================================================================
#  Tortue marine — positions GNSS
# =====================================================================
#  Precision metrique au lieu de kilometrique, au prix d une acquisition a
#  chaque cycle. La tortue ne reste en surface que quelques minutes: toute la
#  configuration vise a fixer VITE, puis a emettre avant la plongee suivante.
#
#  Le piege propre a cette configuration est le filtre trop strict. Un
#  GNSS_HACCFILT_THR serre "pour n avoir que du bon" peut rejeter toutes les
#  positions d une balise qui fonctionne. Les valeurs ici laissent passer ce
#  qu une antenne mouillee peut reellement produire.
# =====================================================================

[PARAM]

PROFILE_NAME = TURTLE-GPS
DEVICE_MODEL = LinkIt-v4-KIM2

# --- Emission ---------------------------------------------------------
# SURFACING_BURST: Doppler des l emersion, puis GNSS des qu une position tombe.
# C est le mode qui exploite le mieux une fenetre de surface courte.
ARGOS_MODE = SURFACING_BURST
ARGOS_TX_REPETITION = 60
# 2 = chaque position part dans 2 salves (redondance), puis la pile alterne
# comme en LEGACY. En SURFACING_BURST, 0 ne veut PAS dire illimite : c est
# UNE seule emission par position (depth_pile.cpp), sans aucun renvoi.
ARGOS_NTRY_PER_MESSAGE = 2
# ATTENTION: la pile ne rapporte quelque chose QUE si le module emet en LDA2,
# c est-a-dire, avec ARGOS_ADAPTIVE_MODULATION = 0, sur une maitresse LDA2.
# En LDK chaque position coute une emission entiere. Voir "The depth pile only
# pays off on LDA2" dans le README, et le cas de banc PROV-01 qui rend le
# verdict pour une carte donnee.
# 4 positions empilees: sur une maitresse LDA2, un paquet LONG en transporte
# jusqu a 3, donc une emission suffit souvent a rapporter tout le cycle.
ARGOS_DEPTH_PILE = 4
ARGOS_DUTY_CYCLE = FFFFFF
ARGOS_TX_JITTER_EN = 1
# 0 = la modulation est celle de la RCONF maitresse (ARGOS_RADIOCONF, a
# provisionner: sa valeur d usine est vide, et le KIM2 retombe alors sur une
# RCONF LDK codee en dur). LDA2 requise pour la pile (LONG 192 b). Le Doppler
# et le Doppler de basse batterie suivent la maitresse: 4 octets en LDA2,
# 16 octets en LDK. Sur SMD, lancer SATVF apres le provisionnement.
ARGOS_ADAPTIVE_MODULATION = 0

# --- Salve d emersion -------------------------------------------------
SURFACING_BURST_INITIAL_INTERVAL = 5
SURFACING_BURST_STEP = 10
SURFACING_BURST_MAX_INTERVAL = 60
# Borne HAUTE de la phase Doppler. A 0 elle est illimitee et l animal reste
# en surface a emettre jusqu a vider la batterie.
SURFACING_BURST_MAX_MSG = 6

# --- GNSS -------------------------------------------------------------
GNSS_ENABLE = 1
# 0 = ni fix degrade ni CloudLocate. C est aussi le defaut, mais il est ecrit
# ici pour qu une balise qui garde un GNSS_FASTLOC_MODE d une configuration
# precedente (1 ou 2) le perde au push de ce profil: sinon une position
# degradee (192 bits) forcerait un passage en LDA2 sur une maitresse LDK.
# Numerique: PyLinkit ne code pas ce parametre.
GNSS_FASTLOC_MODE = 0
# 10 min entre acquisitions. PyLinkit prend des MINUTES et encode lui-meme
# le code fil; les valeurs offertes sont 1 2 5 10 15 20 30 45 60 120 180
# 240 360 720 1440. Une valeur hors de cette liste est refusee, pas arrondie.
GNSS_DELTATIME_ACQ = 10
# 120 echantillons: assez pour un fix a chaud, pas assez pour vider la fenetre.
GNSS_ACQ_TIMEOUT = 120
GNSS_COLD_ACQ_TIMEOUT = 240
# S arreter au premier fix: chaque seconde de recepteur est prise sur la
# fenetre de surface.
GNSS_SESSION_SINGLE_FIX = 1
GNSS_MIN_NUM_FIXES = 1
GNSS_NTRY = 3
# Filtres: actifs mais LARGES. 50 m accepte ce qu une antenne a demi mouillee
# produit; serrer davantage fait taire la balise sans rien tracer.
GNSS_HACCFILT_ENABLE = 1
GNSS_HACCFILT_THR = 50
GNSS_HDOPFILT_ENABLE = 1
GNSS_HDOPFILT_THR = 5
# 7 = GPS + Galileo + GLONASS. Bits: 0=GPS 1=GAL 2=GLO 3=BDS 4=QZSS 5=SBAS.
# BeiDou est retire expres: en B1C le M10 desactive AssistNow et le mode
# economie (RN UBX-22001426 3.1.4), et les TTFF GPS+GAL+GLO sont identiques.
GNSS_CONSTELLATION_MASK = 7
# AUTO plutot que 3D: avec seulement trois satellites en vue, AUTO rend une
# position 2D — sans altitude, mais exploitable. 3D refuserait et la fenetre
# de surface serait perdue. Valeurs: 2D, 3D, AUTO.
GNSS_FIX_MODE = AUTO
GNSS_MIN_CNO = 10
GNSS_MIN_ELEVATION = 5
# Assistance: c est elle qui evite la mort du fix a deux jours.
GNSS_ASSISTNOW_EN = 1
GNSS_ASSISTNOW_OFFLINE_EN = 1
GNSS_ANO_STALE_DAYS = 5
# Veille profonde: garde l ephemeride entre deux cycles courts.
GNSS_DEEP_IDLE_AFTER_OFF_S = 600
# Un fix de moins de 5 min est reutilise plutot que de rallumer le recepteur.
GNSS_REUSE_FIX_MAX_AGE_S = 300
GNSS_TRIGGER_ON_SURFACED = 1

# --- Immersion --------------------------------------------------------
UW_ENABLE = 1
UW_DRY_TIME_BEFORE_TX = 5
MIN_SURFACE_CYCLE_INTERVAL = 0
COOLDOWN_TRIGGER_MODE = 3

# --- Batterie ---------------------------------------------------------
LB_EN = 1
LB_THRESHOLD = 15
LB_CRITICAL_THRESH = 5
# En basse batterie on abandonne le GNSS et on repasse en Doppler: emettre
# une position approximative vaut mieux que ne rien emettre.
LB_ARGOS_MODE = DOPPLER
LB_GNSS_EN = 0
LB_ARGOS_DEPTH_PILE = 1
LB_ARGOS_TX_REPETITION = 600

SAT_PREPASS_EN = 0
ARGOS_RX_EN = 0
RATE_LIMIT_EN = 0
LED_MODE = OFF
