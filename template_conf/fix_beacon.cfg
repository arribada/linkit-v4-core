# =====================================================================
#  Balise fixe — station au sol, position connue
# =====================================================================
#  Une balise qui ne bouge pas: reference de reception, station de test,
#  marqueur de site. La position n a besoin d etre confirmee qu une fois par
#  jour; tout le reste du budget va a la fiabilite de l emission.
#
#  Comme la position est stable, la prediction de passage donne ici son
#  meilleur rendement: on emet uniquement pendant les passages reellement
#  exploitables, et on peut se permettre d etre exigeant sur leur qualite.
#
#  ATTENTION, la meme regle que pour la bouee: PASS_PREDICTION exige
#  GNSS_EN = 1. Une balise fixe donne envie d eteindre le GNSS "puisqu on
#  connait la position" — c est precisement la combinaison qui ne planifie
#  AUCUNE emission. Le GNSS reste allume, simplement tres espace.
# =====================================================================

[PARAM]

PROFILE_NAME = FIX-BEACON
DEVICE_MODEL = LinkIt-v4-KIM2

# --- Emission ---------------------------------------------------------
ARGOS_MODE = 1
SAT_PREPASS_EN = 1
TR_NOM = 60
NTRY_PER_MESSAGE = 0
# 1: la position ne change pas, empiler un historique n a aucun sens.
ARGOS_DEPTH_PILE = 1
DUTY_CYCLE = 16777215
ARGOS_TX_JITTER_EN = 1
ARGOS_ADAPTIVE_MODULATION = 1

# --- Selection des passages -------------------------------------------
# Station immobile a antenne bien placee: on peut etre selectif. 10 deg de
# masque et 20 deg de culmination ecartent les passages mediocres.
PP_MIN_ELEVATION = 10.0
PP_MAX_ELEVATION = 90.0
PP_MIN_DURATION = 180
PP_MAX_PASSES = 1000
PP_LINEAR_MARGIN = 300
PP_COMP_STEP = 10
PP_MIN_CULMINATION = 20
# 0 km: la position ne derive pas, aucune marge n est necessaire.
PP_POSITION_MARGIN_KM = 0

# --- GNSS: allume, mais tres espace -----------------------------------
GNSS_EN = 1
# Code AQPERIOD 10 = 24 h. Une confirmation par jour suffit a alimenter la
# prediction et a detecter un deplacement accidentel du mat.
DLOC_ARG_NOM = 10
GNSS_ACQ_TIMEOUT = 300
GNSS_COLD_ACQ_TIMEOUT = 600
GNSS_SESSION_SINGLE_FIX = 0
# 10 fixes moyennes: le temps ne manque pas, autant obtenir une position fine.
GNSS_MIN_NUM_FIXES = 10
GNSS_NTRY = 3
GNSS_HACCFILT_EN = 1
GNSS_HACCFILT_THR = 20
GNSS_HDOPFILT_EN = 1
GNSS_HDOPFILT_THR = 3
# 15 = GPS + Galileo + GLONASS + BeiDou. Bits: 0=GPS 1=GAL 2=GLO
# 3=BDS 4=QZSS 5=SBAS. Un masque plus etroit allonge le temps de fix.
GNSS_CONSTELLATION_MASK = 15
GNSS_FIX_MODE = 3
# 2 = STATIONARY: le recepteur peut lisser fortement, il sait qu il ne bouge pas.
GNSS_DYN_MODEL = 2
GNSS_MIN_CNO = 20
GNSS_MIN_ELEV = 10
GNSS_ASSISTNOW_EN = 1
GNSS_ASSISTNOW_OFFLINE_EN = 1
GNSS_ANO_STALE_DAYS = 14
GNSS_TRIGGER_ON_SURFACED = 0
# Un fix de moins de 12 h est reutilise: sur une station fixe il reste exact.
GNSS_REUSE_FIX_MAX_AGE_S = 43200

# --- Rien d immerge ---------------------------------------------------
UNDERWATER_EN = 0
DRY_TIME_BEFORE_TX = 0
MIN_SURFACE_CYCLE_INTERVAL_S = 0

# --- Reception --------------------------------------------------------
# Alimentation confortable et antenne fixe: la fenetre de reception est
# quasiment gratuite et maintient la table AOP a jour.
# ARGOS_RX_EN n a d effet QU EN PASS_PREDICTION: ArgosRxService refuse de
# tourner dans tout autre mode (et sur batterie basse, quel que soit le mode).
# Pose ailleurs, ce parametre ne fait rien et ne le dit pas.
ARGOS_RX_EN = 1
ARGOS_RX_MAX_WINDOW = 900
ARGOS_RX_AOP_UPDATE_PERIOD = 259200
# 40 deg: on ne consomme une fenetre de reception que sur un tres bon passage.
PP_RX_MIN_CULMINATION = 40

# --- Batterie ---------------------------------------------------------
# Seuils bas: une station fixe est generalement sur secteur ou sur un pack
# consequent, et un repli premature couterait des donnees pour rien.
LB_EN = 1
LB_THRESHOLD = 10
LB_CRITICAL_THRESH = 3
LB_ARGOS_MODE = 1
LB_GNSS_EN = 1
LB_GNSS_ACQ_TIMEOUT = 120
LB_GNSS_HACCFILT_THR = 100
LB_GNSS_HDOPFILT_THR = 10
LB_ARGOS_DEPTH_PILE = 1
TR_LB = 300

# --- Garde-fou emission ----------------------------------------------
# Une station fixe a la vue degagee en permanence: sans limiteur, une erreur
# de configuration emettrait sans fin. 30 emissions par heure au maximum.
RATE_LIMIT_EN = 1
RATE_LIMIT_WINDOW_S = 3600
RATE_LIMIT_MAX_TX = 30

MOORED_DETECT_EN = 0
HAULED_DETECT_EN = 0
ZONE_ENABLE_OUT_OF_ZONE_DETECTION_MODE = 0
# 3 = toujours: une station accessible se diagnostique a l oeil.
LED_MODE = 3
