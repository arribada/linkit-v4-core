# =====================================================================
#  Cyprus — campagne de calibration accelerometre (10 balises de test)
# =====================================================================
#  Profil de MESURE, pas de deploiement. Il repond a l inconnue qui reste
#  apres le banc du 14/09/2026: quelle est l amplitude de ROULIS de ces
#  coques sur ce mouillage ? C est elle, et non la houle, qui decide du
#  seuil de reveil (voir le bloc AXL_SENSOR_WAKEUP_THRESH de
#  cyprus_boat.cfg). Personne ne l a mesuree, et un geste a la main sur
#  une table ne la remplace pas.
#
#  CE QU ON NE PEUT PAS FAIRE: enregistrer la forme d onde. Le moteur de
#  reveil seuille l ecart entre deux echantillons a 25 Hz (40 ms), or la
#  cadence minimale du firmware est 1 s. Un releve a 1 s aliase une houle
#  de 2 a 8 s et est totalement aveugle a la statistique que la puce
#  mesure. Enregistrer du XYZ brut pour choisir AXP03 ne marcherait pas.
#
#  CE QU ON FAIT A LA PLACE — deux mesures complementaires:
#   (1) UNE ECHELLE DE SEUILS. Le seul parametre qui differe entre les
#       balises est AXL_SENSOR_WAKEUP_THRESH. En comparant les taux de
#       declenchement au mouillage et en route, on reconstruit la courbe
#       de separation et on lit le bon seuil dans la donnee.
#   (2) LA DISTRIBUTION DE GITE. AXL_SENSOR_PERIODIC = 300 echantillonne
#       XYZ toutes les 5 min. Pour un roulis stationnaire, un
#       echantillonnage a phase aleatoire restitue correctement
#       l histogramme marginal: 4032 points sur 14 jours donnent
#       l amplitude de roulis du mouillage, l inconnue dominante.
#
#  ECHELLE — 2 balises par barreau, etiqueter les balises en mg REELS et
#  non en unites de config (l echelle registre est 15.625 mg/LSB a 2G):
#
#    barreau A (balises 1-2)  AXP03 = 0.047   ->  46.9 mg
#        3 sigma au-dessus du bruit: son taux au mouillage EST le taux de
#        bruit, chiffre que personne n a mesure. Bavardage attendu.
#    barreau B (balises 3-4)  AXP03 = 0.0625  ->  62.5 mg
#        Juste au-dessus du pire roulis modelise (57 mg): teste le modele.
#    barreau C (balises 5-6)  AXP03 = 0.094   ->  93.75 mg
#        LE CANDIDAT, celui de cyprus_boat.cfg. Deux balises pour qu une
#        panne ne coute pas la reponse.
#    barreau D (balises 7-8)  AXP03 = 0.125   -> 125 mg
#        Le repli si le barreau C bavarde au mouillage.
#    barreau E (balises 9-10) AXP03 = 0.1875  -> 187.5 mg
#        Borne haute: confirme qu un vrai transit est encore attrape.
#
#  Ces valeurs supposent le firmware a partir du correctif d echelle
#  (deux moteurs, deux echelles). Sur un firmware anterieur elles seraient
#  a diviser par 1.953 — d ou la consigne d etiqueter en mg.
#
#  PROVISIONNEMENT: ecrire par DTE/PyLinkit puis REDEMARRER chaque balise.
#  Le seuil n atteint la puce que dans sensor_init(), au demarrage du
#  service: un PARMW seul ne rearme rien. Verifier avant depart.
#
#  BUILD: -DVALIDATION_LOG_ENABLE=1 (lignes [VAL-MOORED] horodatees avec
#  motif, compteurs et deplacement). Sans surcout hors campagne.
#
#  RELEVE (par balise, sur USB, ~15 min):
#    $DUMPD#001;7\r   log AXL         (evenements + releves periodiques)
#    $DUMPD#001;1\r   log capteur GNSS (la verite terrain)
#    $DUMPD#001;0\r   system.log       (les transitions [VAL-MOORED])
#
#  VOLUME / BATTERIE: 288 lignes/jour a 128 octets = 4032 lignes sur
#  14 jours dans un log circulaire de 8192 entrees, soit la moitie du
#  budget, le reste absorbant les evenements de reveil. Cout ~0.029 mAh/j,
#  environ un septieme d une seule acquisition GNSS: negligeable.
#  Les barreaux A et B peuvent saturer sur un mouillage rouleur; c est
#  assume, ils servent de borne basse.
# =====================================================================

[PARAM]

PROFILE_NAME = CYPRUS-CAMPAGNE-AXL
DEVICE_MODEL = LinkIt-v4-LoRa

# --- Accelerometre : LA mesure --------------------------------------
AXL_SENSOR_ENABLE = 1
# VALEUR A CHANGER PAR BALISE — voir l echelle en tete de fichier.
# Ci-dessous le barreau C (le candidat). Tout le reste est IDENTIQUE sur
# les 10 balises, sinon l echelle est confondue par une autre variable.
AXL_SENSOR_WAKEUP_THRESH = 0.094
AXL_SENSOR_WAKEUP_SAMPLES = 5
# 300 s: la distribution de gite. Seule difference avec le profil flotte.
AXL_SENSOR_PERIODIC = 300
# OBLIGATOIRE et identique partout: fixe l echelle du seuil. Une balise en
# 4G placerait son barreau au double des mg voulus et corromprait la serie.
AXL_SENSOR_MEASUREMENT_RANGE = 2G
AXL_SENSOR_POWER_MODE = 0
# OBLIGATOIRE: a 1, la puce reste en NORMAL et le moteur de reveil est mort
# pour la session — la balise ne mesurerait plus rien.
AXL_FIFO_ENABLE = 0
AXL_SENSOR_ENABLE_TX_MODE = OFF

# --- Mode MOORED : la chaine complete, pour avoir les transitions ----
MOORED_DETECT_EN = 1
MOORED_RADIUS_M = 250
MOORED_ENTER_FIXES = 3
# Les deux candidats mis a l epreuve par la campagne.
MOORED_EXIT_EVENTS = 20
MOORED_AXL_HOLDOFF_S = 1800
MOORED_DLOC = 60
MOORED_TR_NOM = 3600
MOORED_GNSS_EN = 1
MOORED_TX_LAST_POS = 1

# --- GNSS : la verite terrain ---------------------------------------
GNSS_ENABLE = 1
GNSS_DELTATIME_ACQ = 5
GNSS_ACQ_TIMEOUT = 90
GNSS_COLD_ACQ_TIMEOUT = 300
GNSS_MIN_NUM_FIXES = 10
GNSS_NTRY = 0
GNSS_HACCFILT_ENABLE = 1
GNSS_HACCFILT_THR = 50
GNSS_HDOPFILT_ENABLE = 1
GNSS_HDOPFILT_THR = 3
GNSS_CONSTELLATION_MASK = 15
GNSS_FIX_MODE = 3D
GNSS_DYN_MODEL = SEA
GNSS_MIN_CNO = 20
GNSS_MIN_ELEVATION = 10
GNSS_ASSISTNOW_EN = 1
GNSS_ASSISTNOW_OFFLINE_EN = 1
GNSS_ANO_STALE_DAYS = 25
GNSS_REUSE_FIX_MAX_AGE_S = 86400
GNSS_TRIGGER_ON_SURFACED = 0
# OBLIGATOIRE A 0: aux barreaux bas, une balise qui bavarde enchainerait
# une session GNSS par episode et viderait la batterie en heures.
GNSS_TRIGGER_ON_AXL_WAKEUP = 0
GNSS_TRIGGER_COLD_START_ON_SURFACED = 0

# --- LoRa ------------------------------------------------------------
LORA_NJM = 1
LORA_BAND = 4
LORA_CLASS = 0
LORA_DR = 3
LORA_ADR = 0
LORA_TXP = 0
LORA_CFM = 0
LORA_FPORT = 2
LORA_LP_MODE = 1

# --- Argos (= selecteur du mode TX LoRa) -----------------------------
ARGOS_MODE = LEGACY
ARGOS_TX_REPETITION = 1200
ARGOS_NTRY_PER_MESSAGE = 3
ARGOS_DEPTH_PILE = 3
ARGOS_DUTY_CYCLE = FFFFFF
ARGOS_TX_JITTER_EN = 1

# --- Batterie --------------------------------------------------------
LB_EN = 1
LB_THRESHOLD = 10
LB_CRITICAL_THRESH = 5
LB_GNSS_EN = 1
LB_GNSS_ACQ_TIMEOUT = 120
LB_GNSS_HACCFILT_THR = 300
LB_GNSS_HDOPFILT_THR = 10

# --- Rien d immerge, rien de hale, aucune zone -----------------------
UW_ENABLE = 0
MIN_SURFACE_CYCLE_INTERVAL = 0
HAULED_DETECT_EN = 0
ZONE_ENABLE_OUT_OF_ZONE_DETECTION_MODE = 0

LED_MODE = 24HRS
