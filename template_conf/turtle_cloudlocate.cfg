# =====================================================================
#  Tortue marine — CloudLocate (position calculee au sol)
# =====================================================================
#  La balise n a jamais le temps de calculer une position: elle capture un
#  instantane brut des mesures GNSS (quelques secondes suffisent) et l envoie
#  tel quel. C est le segment sol qui en deduit la position. Concu pour les
#  animaux dont la fenetre de surface est trop courte pour un fix complet.
#
#  TROIS conditions doivent etre reunies, sinon le firmware n arme jamais la
#  capture et le deploiement rapporte zero position sans erreur visible:
#      GNSS_ENABLE        = 1
#      GNSS_FASTLOC_MODE  = 2                 (CLOUDLOCATE)
#      ARGOS_MODE         = SURFACING_BURST
#  La derniere est la moins evidente: gps_service ne pose cloudlocate_enable
#  que si le mode Argos est SURFACING_BURST. En LEGACY ou DOPPLER, la capture
#  est silencieusement desactivee.
#
#  PREREQUIS DE PROVISIONNEMENT, pas un parametre de ce fichier:
#  ARGOS_ADAPTIVE_MODULATION = 0 (decision 2026-10): chaque trame part sur la
#  modulation de la RCONF MAITRESSE (ARGOS_RADIOCONF), et nulle part ailleurs.
#    - MEAS20 fait 192 bits: seule une maitresse qui decode en LDA2 le porte.
#      Sur une maitresse LDK, AUCUN CloudLocate n est jamais emis: le creneau
#      repasse a une position en cache ou a un Doppler (correctif 2026-10;
#      avant, il partait vide). La balise emet, mais sans CloudLocate.
#    - La pile de profondeur ne rapporte que sur une maitresse LDA2.
#    - Le Doppler, et le Doppler de basse batterie, suivent la maitresse:
#      4 octets en LDA2, trame de 128 bits (16 octets) en LDK.
#    - ARGOS_RADIOCONF doit etre PROVISIONNEE: sa valeur d usine est VIDE, et
#      une maitresse vide fait retomber le KIM2 sur une RCONF LDK codee en dur.
#      Une balise qui n a connu que adaptive=1 n a peut-etre jamais eu sa
#      maitresse ecrite. Verifier ce qu elle decode (SATVF, cas de banc PROV-01).
#    - Sur SMD: lancer SATVF apres le provisionnement, pour que la modulation
#      relue du module soit enregistree avant le deploiement.
# =====================================================================

[PARAM]

PROFILE_NAME = TURTLE-CLOUDLOCATE
DEVICE_MODEL = LinkIt-v4-KIM2

# --- Emission ---------------------------------------------------------
# Obligatoire pour CloudLocate (voir l entete).
ARGOS_MODE = SURFACING_BURST
ARGOS_TX_REPETITION = 60
# 2 = chaque position part dans 2 salves (redondance), puis la pile alterne
# comme en LEGACY. En SURFACING_BURST, 0 ne veut PAS dire illimite : c est
# UNE seule emission par position (depth_pile.cpp), sans aucun renvoi.
ARGOS_NTRY_PER_MESSAGE = 2
# Chauffe TCXO (s) des emissions qui suivent la 1re d une emersion (la 1re part
# toujours a 0 s, sauf puce < 5 C). Le module l attend AVANT d emettre : 5 s par
# defaut retardaient la trame GNSS d autant (banc 2026-10-12). 2 s = compromis
# choisi par l operateur entre stabilite Doppler et fenetre de surface.
ARGOS_TCXO_WARMUP_TIME = 2
# ATTENTION: la pile ne rapporte quelque chose QUE si le module emet en LDA2,
# c est-a-dire, avec ARGOS_ADAPTIVE_MODULATION = 0, sur une maitresse LDA2.
# En LDK chaque position coute une emission entiere. Voir "The depth pile only
# pays off on LDA2" dans le README, et le cas de banc PROV-01 qui rend le
# verdict pour une carte donnee.
ARGOS_DEPTH_PILE = 4
ARGOS_DUTY_CYCLE = FFFFFF
ARGOS_TX_JITTER_EN = 1
# 0 = la modulation est celle de la RCONF maitresse; LDA2 requise pour la
# pile (LONG 192 b) et pour MEAS20. Voir l entete.
ARGOS_ADAPTIVE_MODULATION = 0

# --- Salve d emersion -------------------------------------------------
SURFACING_BURST_INITIAL_INTERVAL = 5
SURFACING_BURST_STEP = 10
SURFACING_BURST_MAX_INTERVAL = 60
SURFACING_BURST_MAX_MSG = 6

# --- GNSS / CloudLocate ----------------------------------------------
GNSS_ENABLE = 1
# 2 = CLOUDLOCATE. Numerique: PyLinkit ne code pas ce parametre.
# (0 = rien, 1 = envoyer un fix degrade.)
GNSS_FASTLOC_MODE = 2
# 1 = MEAS20: 20 octets, AUTONOME. Numerique, comme le parametre ci-dessus.
# Prefere a MEASC12 (12 octets), qui exige un indice de position cote sol:
# c est cette dependance qui a fait qu un deploiement precedent n a produit
# aucune position CloudLocate.
# Politique STRICTE depuis 2026-06: si le recepteur n a pas produit le format
# configure, rien n est emis — pas de substitution silencieuse. Verifiez donc
# que le compte CLS attend bien MEAS20.
# MEAS20 = 192 bits = LDA2 uniquement: exige une maitresse LDA2 (voir l entete).
GNSS_CLOUDLOCATE_FORMAT = 1
# 1 = capturer a CHAQUE emersion, pas seulement avant le premier fix. C est le
# reglage adapte aux fenetres de surface courtes; il coute le cold_acq_timeout
# complet a chaque emersion, meme quand un vrai fix arrive.
GNSS_CLOUDLOCATE_ALWAYS = 1
# 0 = on tente quand meme un vrai fix. A 1, la balise ne cherche plus JAMAIS de
# PVT: le watchdog "aucun PVT en N jours" est alors neutralise (le firmware
# sait reconnaitre ce cas et ne se reinitialise pas).
GNSS_CLOUDLOCATE_ONLY = 0
GNSS_ACQ_TIMEOUT = 60
GNSS_COLD_ACQ_TIMEOUT = 90
GNSS_SESSION_SINGLE_FIX = 1
GNSS_MIN_NUM_FIXES = 1
GNSS_NTRY = 2
# 7 = GPS + Galileo + GLONASS. Bits: 0=GPS 1=GAL 2=GLO 3=BDS 4=QZSS 5=SBAS.
# BeiDou est retire expres: en B1C le M10 desactive AssistNow et le mode
# economie (RN UBX-22001426 3.1.4), et les TTFF GPS+GAL+GLO sont identiques.
GNSS_CONSTELLATION_MASK = 7
GNSS_FIX_MODE = AUTO
GNSS_MIN_CNO = 10
GNSS_MIN_ELEVATION = 5
GNSS_ASSISTNOW_EN = 1
GNSS_ASSISTNOW_OFFLINE_EN = 1
GNSS_ANO_STALE_DAYS = 5
GNSS_TRIGGER_ON_SURFACED = 1
# 2026-10: ce parametre MANQUAIT, et son absence vaut 0 — rail GNSS coupe apres
# chaque session, donc chaque emersion repayait la configuration complete a
# froid: 2602 ms d attentes fixes et cinq echanges UART de plus avant que le
# recepteur n ecoute (comptes dans m10qasync.cpp, cf.
# tests/src/gnss_short_window_sim_test.cpp). Sans pile V_BCKP, ce rail maintenu
# est de plus la seule chose qui conserve les ephemerides d une emersion a la
# suivante. 1800 s couvre une plongee de 30 min; au-dela le rail est coupe, ce
# qui exerce periodiquement le chemin a froid.
# Pour une balise dont les remontees se comptent en secondes, voir le profil
# dedie turtle_argos_surface.cfg.
GNSS_DEEP_IDLE_AFTER_OFF_S = 1800
# Filtres desactives: ils portent sur une position calculee a bord, qui
# n existe pas ici. Les laisser actifs n aide pas et peut rejeter le fix de
# repli quand il finit par arriver.
# Et sur une maitresse LDK: un filtre actif stocke un PVT degrade, que la salve
# (FASTLOC_MODE = 2 l inclut) emet en fastloc 192 bits en BASCULANT le module
# en LDA2 — bascule qui reste collee sur SMD jusqu au prochain demarrage.
GNSS_HACCFILT_ENABLE = 0
GNSS_HDOPFILT_ENABLE = 0

# --- Immersion --------------------------------------------------------
UW_ENABLE = 1
UW_DRY_TIME_BEFORE_TX = 5
MIN_SURFACE_CYCLE_INTERVAL = 0
COOLDOWN_TRIGGER_MODE = 3

# --- Batterie ---------------------------------------------------------
LB_EN = 1
LB_THRESHOLD = 15
LB_CRITICAL_THRESH = 5
# Repli Doppler: CloudLocate coute une capture GNSS a chaque emersion.
LB_ARGOS_MODE = DOPPLER
LB_GNSS_EN = 0
LB_ARGOS_DEPTH_PILE = 1
LB_ARGOS_TX_REPETITION = 600

SAT_PREPASS_EN = 0
ARGOS_RX_EN = 0
RATE_LIMIT_EN = 0
LED_MODE = OFF
