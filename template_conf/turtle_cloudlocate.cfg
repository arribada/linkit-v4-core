# =====================================================================
#  Tortue marine — CloudLocate (position calculee au sol)
# =====================================================================
#  La balise n a jamais le temps de calculer une position: elle capture un
#  instantane brut des mesures GNSS (quelques secondes suffisent) et l envoie
#  tel quel. C est le segment sol qui en deduit la position. Concu pour les
#  animaux dont la fenetre de surface est trop courte pour un fix complet.
#
#  TROIS conditions doivent etre reunies, sinon le firmware n arme jamais la
#  capture et le deploiement rapporte zero position sans erreur visible:
#      GNSS_ENABLE        = 1
#      GNSS_FASTLOC_MODE  = 2                 (CLOUDLOCATE)
#      ARGOS_MODE         = SURFACING_BURST
#  La derniere est la moins evidente: gps_service ne pose cloudlocate_enable
#  que si le mode Argos est SURFACING_BURST. En LEGACY ou DOPPLER, la capture
#  est silencieusement desactivee.
# =====================================================================

[PARAM]

PROFILE_NAME = TURTLE-CLOUDLOCATE
DEVICE_MODEL = LinkIt-v4-KIM2

# --- Emission ---------------------------------------------------------
# Obligatoire pour CloudLocate (voir l entete).
ARGOS_MODE = SURFACING_BURST
ARGOS_TX_REPETITION = 60
ARGOS_NTRY_PER_MESSAGE = 0
# ATTENTION, dependance de PROVISIONNEMENT: un paquet LONG fait 192 bits et la
# modulation LDK n en porte que 128. Sur un module dont la RCONF maitresse est
# LDK, le firmware plafonne deliberement a UNE position par emission — la pile
# de profondeur ne fait alors rien gagner et chaque position coute une emission
# entiere. ARGOS_ADAPTIVE_MODULATION=1 (pose dans ce fichier) autorise le
# service a passer en LDA2 le temps de l emission, mais seulement si LDA2 est
# provisionne dans le module (ARGOS_RADIOCONF_LDA2). A verifier avant de
# compter sur la pile.
ARGOS_DEPTH_PILE = 4
ARGOS_DUTY_CYCLE = FFFFFF
ARGOS_TX_JITTER_EN = 1
ARGOS_ADAPTIVE_MODULATION = 1

# --- Salve d emersion -------------------------------------------------
SURFACING_BURST_INITIAL_INTERVAL = 5
SURFACING_BURST_STEP = 10
SURFACING_BURST_MAX_INTERVAL = 60
SURFACING_BURST_MAX_MSG = 6

# --- GNSS / CloudLocate ----------------------------------------------
GNSS_ENABLE = 1
# 2 = CLOUDLOCATE. Numerique: PyLinkit ne code pas ce parametre.
# (0 = rien, 1 = envoyer un fix degrade.)
GNSS_FASTLOC_MODE = 2
# 1 = MEAS20: 20 octets, AUTONOME. Numerique, comme le parametre ci-dessus.
# Prefere a MEASC12 (12 octets), qui exige un indice de position cote sol:
# c est cette dependance qui a fait qu un deploiement precedent n a produit
# aucune position CloudLocate.
# Politique STRICTE depuis 2026-06: si le recepteur n a pas produit le format
# configure, rien n est emis — pas de substitution silencieuse. Verifiez donc
# que le compte CLS attend bien MEAS20.
GNSS_CLOUDLOCATE_FORMAT = 1
# 1 = capturer a CHAQUE emersion, pas seulement avant le premier fix. C est le
# reglage adapte aux fenetres de surface courtes; il coute le cold_acq_timeout
# complet a chaque emersion, meme quand un vrai fix arrive.
GNSS_CLOUDLOCATE_ALWAYS = 1
# 0 = on tente quand meme un vrai fix. A 1, la balise ne cherche plus JAMAIS de
# PVT: le watchdog "aucun PVT en N jours" est alors neutralise (le firmware
# sait reconnaitre ce cas et ne se reinitialise pas).
GNSS_CLOUDLOCATE_ONLY = 0
GNSS_ACQ_TIMEOUT = 60
GNSS_COLD_ACQ_TIMEOUT = 90
GNSS_SESSION_SINGLE_FIX = 1
GNSS_MIN_NUM_FIXES = 1
GNSS_NTRY = 2
# 15 = GPS + Galileo + GLONASS + BeiDou. Bits: 0=GPS 1=GAL 2=GLO
# 3=BDS 4=QZSS 5=SBAS. Un masque plus etroit allonge le temps de fix.
GNSS_CONSTELLATION_MASK = 15
GNSS_FIX_MODE = AUTO
GNSS_MIN_CNO = 10
GNSS_MIN_ELEVATION = 5
GNSS_ASSISTNOW_EN = 1
GNSS_ASSISTNOW_OFFLINE_EN = 1
GNSS_ANO_STALE_DAYS = 5
GNSS_TRIGGER_ON_SURFACED = 1
# Filtres desactives: ils portent sur une position calculee a bord, qui
# n existe pas ici. Les laisser actifs n aide pas et peut rejeter le fix de
# repli quand il finit par arriver.
GNSS_HACCFILT_ENABLE = 0
GNSS_HDOPFILT_ENABLE = 0

# --- Immersion --------------------------------------------------------
UW_ENABLE = 1
UW_DRY_TIME_BEFORE_TX = 5
MIN_SURFACE_CYCLE_INTERVAL = 0
COOLDOWN_TRIGGER_MODE = 3

# --- Batterie ---------------------------------------------------------
LB_EN = 1
LB_THRESHOLD = 15
LB_CRITICAL_THRESH = 5
# Repli Doppler: CloudLocate coute une capture GNSS a chaque emersion.
LB_ARGOS_MODE = DOPPLER
LB_GNSS_EN = 0
LB_ARGOS_DEPTH_PILE = 1
LB_ARGOS_TX_REPETITION = 600

SAT_PREPASS_EN = 0
ARGOS_RX_EN = 0
RATE_LIMIT_EN = 0
LED_MODE = OFF
