# =====================================================================
#  Bouee derivante — surface permanente, position GNSS
# =====================================================================
#  Une bouee ne plonge pas. Toute la logique d immersion, de salve d emersion
#  et de refroidissement de plongee est donc inutile ici, et surtout: chacune
#  de ces mecaniques est une facon supplementaire de rendre la balise muette
#  pour un evenement qui n arrivera jamais. On les eteint explicitement.
#
#  En contrepartie, la position est toujours connue et l antenne toujours
#  degagee: c est le cas ideal pour la prediction de passage, qui n emet que
#  lorsqu un satellite est reellement en vue.
#
#  PIEGE MAJEUR: PASS_PREDICTION exige GNSS_EN = 1. Le service le refuse
#  autrement (log ERROR + LED rouge) et AUCUNE emission n est planifiee. La
#  prediction a besoin d une position pour etre calculee.
#  Elle a aussi besoin d une table AOP a jour (ARGOS_AOP_DATE) : une table
#  perimee degrade les predictions bien avant de les rendre fausses.
# =====================================================================

[PARAM]

PROFILE_NAME = DRIFTER
DEVICE_MODEL = LinkIt-v4-KIM2

# --- Emission ---------------------------------------------------------
# PASS_PREDICTION: on emet quand un satellite est visible, pas au hasard.
ARGOS_MODE = 1
SAT_PREPASS_EN = 1
TR_NOM = 90
NTRY_PER_MESSAGE = 0
# 4 positions par paquet: la derive est lente, un historique dense a peu de
# valeur, mais il compense les passages manques.
ARGOS_DEPTH_PILE = 4
DUTY_CYCLE = 16777215
ARGOS_TX_JITTER_EN = 1
ARGOS_ADAPTIVE_MODULATION = 1

# --- Selection des passages -------------------------------------------
# 5 deg: on ecarte les passages rasants, dont le bilan de liaison est mauvais.
PP_MIN_ELEVATION = 5.0
PP_MAX_ELEVATION = 90.0
# Duree minimale d un passage retenu. En dessous, la fenetre ne permet pas
# assez de repetitions pour esperer une localisation.
PP_MIN_DURATION = 120
PP_MAX_PASSES = 1000
PP_LINEAR_MARGIN = 300
PP_COMP_STEP = 10
# Culmination = elevation MAXIMALE atteinte au milieu du passage. 15 deg
# ecarte les passages qui ne montent jamais, meme s ils durent longtemps.
PP_MIN_CULMINATION = 15
# Marge sur la position utilisee pour predire: une bouee derive entre deux
# fixes, la fenetre est elargie d autant.
PP_POSITION_MARGIN_KM = 20

# --- GNSS -------------------------------------------------------------
# Obligatoire en PASS_PREDICTION (voir l entete).
GNSS_EN = 1
# Code AQPERIOD 4 = 1 heure. Table: 11=1min 12=2min 13=5min 1=10min 2=15min
# 14=20min 3=30min 15=45min 4=1h 5=2h 6=3h 7=4h 8=6h 9=12h 10=24h.
DLOC_ARG_NOM = 4
# Antenne degagee et immobile: un fix arrive vite, inutile de laisser tourner.
GNSS_ACQ_TIMEOUT = 120
GNSS_COLD_ACQ_TIMEOUT = 300
GNSS_SESSION_SINGLE_FIX = 0
# Plusieurs fixes moyennes: la bouee bouge peu pendant la session, on gagne en
# precision sans allonger la session.
GNSS_MIN_NUM_FIXES = 3
GNSS_NTRY = 3
GNSS_HACCFILT_EN = 1
GNSS_HACCFILT_THR = 30
GNSS_HDOPFILT_EN = 1
GNSS_HDOPFILT_THR = 4
# 15 = GPS + Galileo + GLONASS + BeiDou. Bits: 0=GPS 1=GAL 2=GLO
# 3=BDS 4=QZSS 5=SBAS. Un masque plus etroit allonge le temps de fix.
GNSS_CONSTELLATION_MASK = 15
GNSS_FIX_MODE = 3
# 5 = SEA. La table complete: 0=PORTABLE 2=STATIONARY 3=PEDESTRIAN
# 4=AUTOMOTIVE 5=SEA 6/7/8=AIRBORNE 9=WRIST 10=BIKE. (1 n existe pas.)
GNSS_DYN_MODEL = 5
GNSS_MIN_CNO = 15
GNSS_MIN_ELEV = 5
GNSS_ASSISTNOW_EN = 1
GNSS_ASSISTNOW_OFFLINE_EN = 1
GNSS_ANO_STALE_DAYS = 7
GNSS_TRIGGER_ON_SURFACED = 0

# --- Pas d immersion --------------------------------------------------
# Une bouee ne plonge pas: le SWS n apporterait que des faux positifs (paquet
# de mer sur l electrode) qui bloqueraient l emission.
UNDERWATER_EN = 0
DRY_TIME_BEFORE_TX = 0
MIN_SURFACE_CYCLE_INTERVAL_S = 0

# --- Reception (mise a jour AOP par satellite) ------------------------
# La bouee est en surface en permanence: c est le seul profil ou une fenetre
# de reception est realiste. Elle rafraichit la table AOP dont depend la
# prediction de passage.
# ARGOS_RX_EN n a d effet QU EN PASS_PREDICTION: ArgosRxService refuse de
# tourner dans tout autre mode (et sur batterie basse, quel que soit le mode).
# Pose ailleurs, ce parametre ne fait rien et ne le dit pas.
ARGOS_RX_EN = 1
ARGOS_RX_MAX_WINDOW = 900
# 7 jours entre deux tentatives de rafraichissement.
ARGOS_RX_AOP_UPDATE_PERIOD = 604800
PP_RX_MIN_CULMINATION = 30

# --- Batterie ---------------------------------------------------------
LB_EN = 1
LB_THRESHOLD = 20
LB_CRITICAL_THRESH = 5
# On garde la prediction de passage en basse batterie: c est justement le mode
# le plus econome. Mais GNSS_EN doit rester a 1, sinon plus rien n est planifie.
LB_ARGOS_MODE = 1
LB_GNSS_EN = 1
LB_GNSS_ACQ_TIMEOUT = 60
LB_GNSS_HACCFILT_THR = 100
LB_GNSS_HDOPFILT_THR = 10
LB_ARGOS_DEPTH_PILE = 2
TR_LB = 300

# --- Garde-fou emission ----------------------------------------------
# Une bouee immobile en surface permanente peut, sur une erreur de config,
# emettre sans discontinuer. Le limiteur borne la casse: 40 emissions par
# heure au maximum.
RATE_LIMIT_EN = 1
RATE_LIMIT_WINDOW_S = 3600
RATE_LIMIT_MAX_TX = 40

MOORED_DETECT_EN = 0
HAULED_DETECT_EN = 0
ZONE_ENABLE_OUT_OF_ZONE_DETECTION_MODE = 0
# 1 = HRS_24: la LED ne vit que les 24 premieres heures. Assez pour verifier
# le deploiement a la mise a l eau, sans grever le budget ensuite.
# Valeurs acceptees: 0 = OFF, 1 = 24 h, 3 = toujours. 2 est REFUSE.
LED_MODE = 1
