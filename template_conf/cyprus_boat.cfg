# =====================================================================
#  Bateau au mouillage — LoRa, detection MOORED
# =====================================================================
#  Un bateau qui passe son temps a l ancre et sort de temps en temps. Tout
#  l interet est de distinguer les deux, parce que les cadences ne sont pas
#  les memes: au mouillage on peut ralentir fortement, en route il faut
#  suivre. C est le role de MOORED_DETECT_EN.
#
#  Ce profil corrige trois reglages d une campagne de terrain (nuit du
#  01 au 02/09/2026, La Reunion) pendant laquelle la balise, POSEE ET
#  IMMOBILE, a bascule 9 fois entre MOORED et UNDERWAY en 15 heures. Les
#  trois lignes concernees sont signalees CORRIGE ci-dessous; les autres
#  valeurs sont celles de la campagne, qui ont bien fonctionne.
# =====================================================================

[PARAM]

PROFILE_NAME = CYPRUS-BOAT
DEVICE_MODEL = LinkIt-v4-LoRa

# --- Detection du mouillage -------------------------------------------
MOORED_DETECT_EN = 1
# CORRIGE: 100 -> 250 m.
# La sortie de MOORED se declenche des qu UN fix depasse ce rayon. Avec
# GNSS_HACCFILT_THR a 100 m, un fix accepte a la limite de sa precision
# suffisait donc a sortir: les deux seuils etaient le meme nombre. Les 9
# fausses sorties annonçaient 113 a 1036 m de deplacement avec un gSpeed
# de 14 a 215 mm/s — quelques millimetres par seconde, donc immobile.
# Il faut aussi de la place pour l evitage reel sur ancre, que 100 m ne
# laissait deja pas.
MOORED_RADIUS_M = 250
MOORED_ENTER_FIXES = 3
# 3 reveils, pas 2: un claquement de vague isole ne fait pas un depart.
MOORED_EXIT_EVENTS = 3
MOORED_AXL_HOLDOFF_S = 900
# 60 minutes au mouillage. Le fix horaire suffit a la derive lente (chaque
# fix part aussitot en TX) et garde le DBD et la RTC frais; un VRAI depart
# n attend pas cette echeance — la sortie MOORED declenche elle-meme une
# acquisition immediate.
MOORED_DLOC = 60
# Filet seulement: ne porte que les heures ou le GPS n a rien donne.
MOORED_TR_NOM = 3600
MOORED_GNSS_EN = 1
MOORED_TX_LAST_POS = 1

# --- Accelerometre ----------------------------------------------------
AXL_SENSOR_ENABLE = 1
# CORRIGE: 0 -> 0.1 g.
# A zero, le firmware n installe MEME PAS le gestionnaire de reveil
# (axl_sensor_service.hpp: le handler est conditionne a un seuil non nul).
# Le capteur logguait ses mesures mais n etait pas arme en detecteur de
# mouvement: tout le chemin accelerometre de MOORED — MOORED_EXIT_EVENTS,
# MOORED_AXL_HOLDOFF_S — etait donc inerte. Il avait raison toute la nuit,
# personne ne l ecoutait.
# 0.15 g: 0.1 a ete valide sur une nuit CALME (La Reunion); la marge ecarte
# le clapot. Le moteur du BMA400 en low-power compare des VARIATIONS
# d acceleration sur 4 echantillons a 25 Hz (160 ms soutenues): la houle
# lente produit de petits deltas, un depart moteur de grands. Plage de
# reglage terrain raisonnable: 0.1 a 0.2.
AXL_SENSOR_WAKEUP_THRESH = 0.15
AXL_SENSOR_WAKEUP_SAMPLES = 5
AXL_SENSOR_PERIODIC = 0
AXL_SENSOR_MEASUREMENT_RANGE = 2G
AXL_SENSOR_POWER_MODE = 0

# --- GNSS -------------------------------------------------------------
GNSS_ENABLE = 1
# 5 minutes en route; MOORED_DLOC prend le relais au mouillage.
GNSS_DELTATIME_ACQ = 5
GNSS_ACQ_TIMEOUT = 90
# 300 et non 530: ce budget ne s applique qu avant le PREMIER fix de chaque
# boot (et sur cold start force), et 530 s chevauchait deux creneaux de la
# cadence 5 min. Sans pile V_BCKP le demarrage s appuie sur le fichier DBD
# (~5-15 s de TTFF tant qu il a moins de 14 jours), 300 s couvre le cas
# defavorable ciel bouche sans deborder du creneau.
GNSS_COLD_ACQ_TIMEOUT = 300
GNSS_MIN_NUM_FIXES = 3
GNSS_NTRY = 0
GNSS_HACCFILT_ENABLE = 1
# CORRIGE: 100 -> 50 m, qui est aussi le defaut du firmware.
# Un fix dont le hAcc depasse ce seuil est rejete en amont et n atteint
# jamais la logique MOORED. Sur les 9 fausses sorties, 6 portaient un hAcc
# de 54 a 98 m: elles disparaissent avec ce seuil. Attention toutefois,
# les 3 autres annonçaient 28 a 39 m pour une erreur reelle de 183 a
# 216 m — le hAcc est une auto-estimation, il peut mentir d un facteur 5.
# C est le rayon a 250 m qui couvre celles-la.
GNSS_HACCFILT_THR = 50
GNSS_HDOPFILT_ENABLE = 1
GNSS_HDOPFILT_THR = 3
GNSS_CONSTELLATION_MASK = 15
GNSS_FIX_MODE = 3D
# SEA: le recepteur sait qu il est sur l eau.
GNSS_DYN_MODEL = SEA
GNSS_MIN_CNO = 5
GNSS_MIN_ELEVATION = 5
GNSS_ASSISTNOW_EN = 1
GNSS_ASSISTNOW_OFFLINE_EN = 1
GNSS_ANO_STALE_DAYS = 25
GNSS_REUSE_FIX_MAX_AGE_S = 86400
GNSS_TRIGGER_ON_SURFACED = 0
# DELIBEREMENT A 0.
# Ce declencheur fonctionne (un reveil accelerometre lance une acquisition
# immediate), mais il n est BORNE PAR RIEN: MOORED_AXL_HOLDOFF_S ne limite
# que la sortie de MOORED, pas les acquisitions. Sur un mouillage houleux
# il produirait une session GNSS par reveil, dos a dos. A ne remettre a 1
# que lorsque ce bornage existera. Le cas qui motivait ce parametre est
# couvert depuis 2026-09: la sortie MOORED declenche elle-meme une
# acquisition immediate, bornee par le debounce MOORED_EXIT_EVENTS +
# MOORED_AXL_HOLDOFF_S.
GNSS_TRIGGER_ON_AXL_WAKEUP = 0
GNSS_TRIGGER_COLD_START_ON_SURFACED = 0

# --- LoRa -------------------------------------------------------------
# Les identifiants (DEVEUI / APPEUI / APPKEY) sont propres a chaque
# balise: ils ne sont pas dans ce fichier et ne doivent pas y etre.
LORA_NJM = 1
LORA_BAND = 4
LORA_CLASS = 0
LORA_DR = 3
LORA_ADR = 0
LORA_TXP = 0
LORA_CFM = 0
LORA_FPORT = 2
LORA_LP_MODE = 1

# --- Argos ------------------------------------------------------------
# ATTENTION: sur un firmware LoRa, ARGOS_MODE est le selecteur de mode du
# service TX LoRa lui-meme (LoRaTxService::service_is_enabled est
# `ARGOS_MODE != OFF`). OFF ne signifie pas "pas de satellite", il signifie
# AUCUNE emission: la balise logge ses fixes et n envoie rien. Une version
# precedente de ce profil faisait exactement cette erreur. LEGACY = les
# positions partent en TX immediat a chaque fix valide, le heartbeat a
# ARGOS_TX_REPETITION ne couvre que les trous. Le masque horaire reste a
# FFFFFF: a 000000 la balise serait muette 24 h sur 24 sans le dire.
ARGOS_MODE = LEGACY
# Filet, pas cadence: chaque fix valide declenche deja son TX. A 60 s ce
# heartbeat emettait 1440 trames status par jour en route; a 1200 s (le
# plafond du parametre) il ne parle que si le GPS s est tu 20 minutes.
ARGOS_TX_REPETITION = 1200
ARGOS_NTRY_PER_MESSAGE = 3
ARGOS_DEPTH_PILE = 3
ARGOS_DUTY_CYCLE = FFFFFF
ARGOS_TX_JITTER_EN = 1

# --- Batterie ---------------------------------------------------------
LB_EN = 1
LB_THRESHOLD = 10
LB_CRITICAL_THRESH = 5
LB_GNSS_EN = 1
LB_GNSS_ACQ_TIMEOUT = 120
LB_GNSS_HACCFILT_THR = 300
LB_GNSS_HDOPFILT_THR = 10

# --- Rien d immerge, rien de halé, aucune zone ------------------------
UW_ENABLE = 0
# A 0 explicitement: laisse a une valeur non nulle avec UW_ENABLE = 0, le
# firmware emet un WARN au demarrage pour un refroidissement qui ne peut
# pas s appliquer.
MIN_SURFACE_CYCLE_INTERVAL = 0
HAULED_DETECT_EN = 0
ZONE_ENABLE_OUT_OF_ZONE_DETECTION_MODE = 0

LED_MODE = 24HRS
