# =====================================================================
#  Bateau au mouillage — LoRa, detection MOORED
# =====================================================================
#  Un bateau qui passe son temps a l ancre et sort de temps en temps. Tout
#  l interet est de distinguer les deux, parce que les cadences ne sont pas
#  les memes: au mouillage on peut ralentir fortement, en route il faut
#  suivre. C est le role de MOORED_DETECT_EN.
#
#  Ce profil corrige trois reglages d une campagne de terrain (nuit du
#  01 au 02/09/2026, La Reunion) pendant laquelle la balise, POSEE ET
#  IMMOBILE, a bascule 9 fois entre MOORED et UNDERWAY en 15 heures. Les
#  trois lignes concernees sont signalees CORRIGE ci-dessous; les autres
#  valeurs sont celles de la campagne, qui ont bien fonctionne.
# =====================================================================

[PARAM]

PROFILE_NAME = CYPRUS-BOAT
DEVICE_MODEL = LinkIt-v4-LoRa

# --- Detection du mouillage -------------------------------------------
MOORED_DETECT_EN = 1
# CORRIGE: 100 -> 250 m.
# La sortie de MOORED se declenche des qu UN fix depasse ce rayon. Avec
# GNSS_HACCFILT_THR a 100 m, un fix accepte a la limite de sa precision
# suffisait donc a sortir: les deux seuils etaient le meme nombre. Les 9
# fausses sorties annonçaient 113 a 1036 m de deplacement avec un gSpeed
# de 14 a 215 mm/s — quelques millimetres par seconde, donc immobile.
# Il faut aussi de la place pour l evitage reel sur ancre, que 100 m ne
# laissait deja pas.
MOORED_RADIUS_M = 250
MOORED_ENTER_FIXES = 3
# 20, et non 3. Ce parametre n est PAS le debounce que son nom suggere: un
# seul mouvement physique produit BEAUCOUP d interruptions, pas une. Mesure
# au banc: 18 declenchements en 3 s, soit ~6/s. A 3, la moindre rafale de
# roulis sort du mode MOORED en une demi-seconde. A 20, il faut 20 episodes
# DANS LA FENETRE DE SALVE de 600 s (soit 2/min soutenues) — ce qu un
# bateau en route atteint en quelques secondes et qu un mouillage rouleur
# n atteint pas, ses episodes etant isoles et la fenetre les oubliant.
MOORED_EXIT_EVENTS = 20
# 1800 s. Ne s arme qu APRES une sortie accelerometre (il est conditionne a
# last_axl_exit_rtc non nul), donc il ne protege pas la premiere sortie: il
# borne la REPETITION. A 900 s, apres une fausse sortie la balise repassait
# en MOORED (3 fixes a 5 min) juste a temps pour ressortir. 1800 s casse ce
# cycle et plafonne le cout d un mouillage rouleur a 2 fausses sorties/h.
MOORED_AXL_HOLDOFF_S = 1800
# 60 minutes au mouillage. Le fix horaire suffit a la derive lente (chaque
# fix part aussitot en TX) et garde le DBD et la RTC frais; un VRAI depart
# n attend pas cette echeance — la sortie MOORED declenche elle-meme une
# acquisition immediate.
MOORED_DLOC = 60
# Filet seulement: ne porte que les heures ou le GPS n a rien donne.
MOORED_TR_NOM = 3600
MOORED_GNSS_EN = 1
MOORED_TX_LAST_POS = 1

# --- Accelerometre ----------------------------------------------------
AXL_SENSOR_ENABLE = 1
# CORRIGE: 0 -> 0.1 g.
# A zero, le firmware n installe MEME PAS le gestionnaire de reveil
# (axl_sensor_service.hpp: le handler est conditionne a un seuil non nul).
# Le capteur logguait ses mesures mais n etait pas arme en detecteur de
# mouvement: tout le chemin accelerometre de MOORED — MOORED_EXIT_EVENTS,
# MOORED_AXL_HOLDOFF_S — etait donc inerte. Il avait raison toute la nuit,
# personne ne l ecoutait.
# 0.094 g -> registre 6 -> 93.75 mg REELS. Le nombre ci-dessous et le seuil
# physique ne sont pas la meme grandeur: lire l echelle plus bas.
#
# CE QUE LE MOTEUR MESURE. En LOW_POWER avec wkup_refu=EVERYTIME, la puce
# compare chaque echantillon au PRECEDENT, a 25 Hz, sur 4 echantillons
# consecutifs. Le seuil porte donc sur l ECART entre deux mesures espacees
# de 40 ms — un passe-haut — et non sur l acceleration du geste. Pour un
# mouvement sinusoidal d amplitude A et de frequence f, cet ecart vaut
# environ A*2*pi*f*0.04.
#
# CE CONTRE QUOI ON SE PROTEGE, dans l ordre reel d importance:
#   1. LE ROULIS, pas la houle. Un capteur qui s incline lit g*sin(theta),
#      10 a 20x plus que le pilonnement. Gite de 15 deg a 3 s -> 31.5 mg;
#      20 deg a 2.5 s -> 34 mg (projection seule) a 57 mg (avec le terme
#      tangentiel a 1 m de l axe). Les periodes de roulis des petites
#      unites (2-4 s) tombent EN PLEIN dans la bande du detecteur, et le
#      roulis est soutenu: la regle des 4 echantillons ne le rejette pas.
#      Pire cas credible au mouillage: ~57 mg.
#   2. La houle est un non-probleme. 0.1 Hz a 0.10 g -> 2.5 mg d ecart,
#      sous le plus petit seuil reglable. Il faudrait ~15 m crete a crete
#      pour atteindre 1 LSB. Ne pas budgeter contre elle.
#   3. Le bruit du capteur: ~15.5 mg RMS sur l ecart (osr_lp=0).
# En face, un bateau en route: 2 Hz a 0.30 g -> 151 mg; mer formee 3 Hz a
# 0.50 g -> 377 mg; deferlante/tape de coque -> plusieurs g.
#
# POURQUOI 93.75 mg. Il passe 1.64x au-dessus du pire roulis modelise
# (57 mg) et 6 sigma au-dessus du bruit. Le choix est DELIBEREMENT haut:
# il existe un recouvrement irreductible (une coque a deplacement a 5-6 kt
# sur eau plate ne produit que 10-30 mg, soit MOINS qu un mouillage rouleur)
# qu aucun seuil unique ne separe. Donc on choisit l erreur qu on peut
# payer: manquer un depart doux coute au pire 60 min de latence, car le fix
# GNSS horaire du mode MOORED (MOORED_DLOC) et le rayon de 250 m le
# rattrapent — l accelerometre n est qu un REDUCTEUR DE LATENCE, pas
# l unique oracle. Une fausse sortie, elle, coute ~0.85 mAh (acquisition
# immediate + cadence 5 min jusqu a 3 fixes stationnaires), et repetee sur
# un mouillage rouleur c est le panneau solaire qui trinque.
#
# ECHELLE DU REGISTRE (piege). Le seuil de reveil est SENSIBLE A LA PLAGE:
# datasheet BST-BMA400-DS000-02 p.80, "The physical value of LSB corresponds
# to 2^(2+acc_range)/256" -> 15.625 mg/LSB en +/-2g. GEN1, lui, est a 8 mg
# fixe: deux echelles distinctes, que le firmware a longtemps confondues.
# CONSEQUENCE: ce nombre n a de sens qu a 2G. Passer en 4G doublerait le
# seuil reel a 187.5 mg sans changer la ligne ci-dessous.
#
# BANC 14/09/2026, carte Cyprus, en mg REELS (apres re-echelonnage):
#   297 mg -> 0 declenchement meme en agitant franchement
#    78 mg -> 0 au repos sur 12 s, 18 declenchements sur 3 s de mouvement
#    16 mg -> declenche au repos: c est le plancher de bruit
#
# A REVALIDER AU MOUILLAGE REEL: l inconnue dominante reste l amplitude de
# roulis de cette coque sur ce mouillage, que personne n a mesuree. C est
# l objet de cyprus_boat_campaign.cfg (echelle de seuils sur 10 balises).
AXL_SENSOR_WAKEUP_THRESH = 0.094
# INERTE en mode 0, mais doit rester NON NUL. En LOW_POWER le nombre
# d echantillons est code en dur (BMA400_SAMPLE_COUNT_4); cette valeur ne
# nourrit gen_int_dur que sur la branche NORMAL/GEN1. A zero en revanche,
# le handler de reveil n est meme pas installe — c etait le bug terrain de
# la campagne de La Reunion.
AXL_SENSOR_WAKEUP_SAMPLES = 5
# 0 = pas de releve periodique sur la flotte: l accelerometre est une
# sentinelle, pas de la telemetrie. Les 10 balises de campagne, elles,
# mettent 300 (voir cyprus_boat_campaign.cfg) — ne pas reimporter cette
# valeur ici.
AXL_SENSOR_PERIODIC = 0
# LIGNE PORTEUSE, pas cosmetique: elle fixe l echelle du seuil de reveil
# (2^(2+range)/256 g par LSB). Passer en 4G doublerait silencieusement le
# seuil reel sans changer AXL_SENSOR_WAKEUP_THRESH.
AXL_SENSOR_MEASUREMENT_RANGE = 2G
# 0 = LOW_POWER, seul mode ou le moteur d auto-reveil evalue. Le mode 1
# bascule sur GEN1 en NORMAL, qui mesure autre chose et consomme plus.
AXL_SENSOR_POWER_MODE = 0
# EXPLICITE, bien que ce soit deja le defaut: a 1, enable_fifo laisse la
# puce en NORMAL en permanence et read_fifo_batch ne la reveille jamais —
# le moteur d auto-reveil est alors mort pour la session. Piege a fermer
# par ecrit.
AXL_FIFO_ENABLE = 0
# EXPLICITE (deja le defaut): activer ce mode ferait basculer le service en
# agregation pilotee par le GNSS (une entree moyennee par session au lieu
# des evenements) et ferait passer la trame LoRa de 106 a 173 bits.
AXL_SENSOR_ENABLE_TX_MODE = OFF

# --- GNSS -------------------------------------------------------------
GNSS_ENABLE = 1
# 5 minutes en route; MOORED_DLOC prend le relais au mouillage.
GNSS_DELTATIME_ACQ = 5
GNSS_ACQ_TIMEOUT = 90
# 300 et non 530: ce budget ne s applique qu avant le PREMIER fix de chaque
# boot (et sur cold start force), et 530 s chevauchait deux creneaux de la
# cadence 5 min. Sans pile V_BCKP le demarrage s appuie sur le fichier DBD
# (~5-15 s de TTFF tant qu il a moins de 14 jours), 300 s couvre le cas
# defavorable ciel bouche sans deborder du creneau.
GNSS_COLD_ACQ_TIMEOUT = 300
# 10 et non 3: compte a rebours d'epoques CONSECUTIVES passant les filtres,
# recepteur a 1 Hz — 3 n'achetait que 3 s de convergence, trop court pour
# une solution qui se stabilise en 10-20 s. La position emise est la
# DERNIERE epoque de la serie (pas de best-of), la fenetre de coherence
# est donc la seule defense contre un outlier multipath auto-coherent.
# Cout: ~7 s de recepteur en plus par session, loin du budget de 90 s.
GNSS_MIN_NUM_FIXES = 10
GNSS_NTRY = 0
GNSS_HACCFILT_ENABLE = 1
# CORRIGE: 100 -> 50 m, qui est aussi le defaut du firmware.
# Un fix dont le hAcc depasse ce seuil est rejete en amont et n atteint
# jamais la logique MOORED. Sur les 9 fausses sorties, 6 portaient un hAcc
# de 54 a 98 m: elles disparaissent avec ce seuil. Attention toutefois,
# les 3 autres annonçaient 28 a 39 m pour une erreur reelle de 183 a
# 216 m — le hAcc est une auto-estimation, il peut mentir d un facteur 5.
# C est le rayon a 250 m qui couvre celles-la.
GNSS_HACCFILT_THR = 50
GNSS_HDOPFILT_ENABLE = 1
GNSS_HDOPFILT_THR = 3
GNSS_CONSTELLATION_MASK = 15
GNSS_FIX_MODE = 3D
# SEA: le recepteur sait qu il est sur l eau.
GNSS_DYN_MODEL = SEA
# Les deux masques anti-multipath — la campagne les avait LACHES sous les
# defauts firmware (10/10), or le multipath est exactement le menteur
# documente plus haut (hAcc 28-39 m pour 183-216 m d erreur reelle). Sur
# un bateau la reflexion speculaire sur l eau arrive a basse elevation et
# 6-15 dB sous le trajet direct : 10 deg + 20 dBHz coupent la geometrie
# reflechie sans presque rien couter a ciel ouvert (8-14 SV restants avec
# les 4 constellations). Prerequis : antenne au-dessus du pont.
GNSS_MIN_CNO = 20
GNSS_MIN_ELEVATION = 10
GNSS_ASSISTNOW_EN = 1
GNSS_ASSISTNOW_OFFLINE_EN = 1
GNSS_ANO_STALE_DAYS = 25
GNSS_REUSE_FIX_MAX_AGE_S = 86400
GNSS_TRIGGER_ON_SURFACED = 0
# DELIBEREMENT A 0.
# Ce declencheur fonctionne (un reveil accelerometre lance une acquisition
# immediate), mais il n est BORNE PAR RIEN: MOORED_AXL_HOLDOFF_S ne limite
# que la sortie de MOORED, pas les acquisitions. Sur un mouillage houleux
# il produirait une session GNSS par reveil, dos a dos. A ne remettre a 1
# que lorsque ce bornage existera. Le cas qui motivait ce parametre est
# couvert depuis 2026-09: la sortie MOORED declenche elle-meme une
# acquisition immediate, bornee par le debounce MOORED_EXIT_EVENTS +
# MOORED_AXL_HOLDOFF_S.
GNSS_TRIGGER_ON_AXL_WAKEUP = 0
GNSS_TRIGGER_COLD_START_ON_SURFACED = 0

# --- LoRa -------------------------------------------------------------
# Les identifiants (DEVEUI / APPEUI / APPKEY) sont propres a chaque
# balise: ils ne sont pas dans ce fichier et ne doivent pas y etre.
LORA_NJM = 1
LORA_BAND = 4
LORA_CLASS = 0
LORA_DR = 3
LORA_ADR = 0
LORA_TXP = 0
LORA_CFM = 0
LORA_FPORT = 2
LORA_LP_MODE = 1

# --- Argos ------------------------------------------------------------
# ATTENTION: sur un firmware LoRa, ARGOS_MODE est le selecteur de mode du
# service TX LoRa lui-meme (LoRaTxService::service_is_enabled est
# `ARGOS_MODE != OFF`). OFF ne signifie pas "pas de satellite", il signifie
# AUCUNE emission: la balise logge ses fixes et n envoie rien. Une version
# precedente de ce profil faisait exactement cette erreur. LEGACY = les
# positions partent en TX immediat a chaque fix valide, le heartbeat a
# ARGOS_TX_REPETITION ne couvre que les trous. Le masque horaire reste a
# FFFFFF: a 000000 la balise serait muette 24 h sur 24 sans le dire.
ARGOS_MODE = LEGACY
# Filet, pas cadence: chaque fix valide declenche deja son TX. A 60 s ce
# heartbeat emettait 1440 trames status par jour en route; a 1200 s (le
# plafond du parametre) il ne parle que si le GPS s est tu 20 minutes.
ARGOS_TX_REPETITION = 1200
ARGOS_NTRY_PER_MESSAGE = 3
ARGOS_DEPTH_PILE = 3
ARGOS_DUTY_CYCLE = FFFFFF
ARGOS_TX_JITTER_EN = 1

# --- Batterie ---------------------------------------------------------
LB_EN = 1
LB_THRESHOLD = 10
LB_CRITICAL_THRESH = 5
LB_GNSS_EN = 1
LB_GNSS_ACQ_TIMEOUT = 120
LB_GNSS_HACCFILT_THR = 300
LB_GNSS_HDOPFILT_THR = 10

# --- Rien d immerge, rien de halé, aucune zone ------------------------
UW_ENABLE = 0
# A 0 explicitement: laisse a une valeur non nulle avec UW_ENABLE = 0, le
# firmware emet un WARN au demarrage pour un refroidissement qui ne peut
# pas s appliquer.
MIN_SURFACE_CYCLE_INTERVAL = 0
HAULED_DETECT_EN = 0
ZONE_ENABLE_OUT_OF_ZONE_DETECTION_MODE = 0

LED_MODE = 24HRS
