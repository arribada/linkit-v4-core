# =====================================================================
#  Tortue marine — LoRa, salve d emersion et CloudLocate MEAS50
# =====================================================================
#  Projet : WWF-YanaRiba (tortues olivatres, Guyane), balise LoRa.
#  Build : ./scripts/build_linkitv4_lora.sh.
#
#  SOURCE : la configuration de Caipirina, seule balise LoRa du programme,
#  telle que le Config Tool l a enregistree (firmware v4.1.8), extraite de la
#  plateforme le 29/10/2026. Le template de production « WWF-OliverRidkey-lora »
#  n a servi a aucune balise telle quelle (11 ecarts avec Caipirina).
#  Les valeurs sont celles de Caipirina, traduites dans la langue de PyLinkit,
#  sauf les deux lignes marquees CORRIGE et le delai de lecture du SWS, laisse
#  aux defauts du firmware comme dans les autres modeles tortue. Retire :
#    - l etat et l identite de la carte ; les cles LoRa (ABP ici :
#      LORA_DEVADDR, LORA_NWKSKEY, LORA_APPSKEY), propres a chaque balise ;
#    - ce qu un build LoRa ne lit pas (synchro horaire Argos, chauffe TCXO,
#      modulation adaptative, reception Argos, masque horaire hors
#      DUTY_CYCLE) et les familles coupees ici (basse batterie, echouage,
#      zone, limiteur, mode plongee), dont les reglages seraient sans effet.
#  Les parametres ajoutes depuis la v4.1.8 restent a leur defaut.
#
#  Sur un build LoRa, ARGOS_MODE et les parametres ARGOS_ / SURFACING_BURST_
#  pilotent l emission LoRa elle-meme : ARGOS_MODE = OFF rendrait la balise
#  muette.
#
#  A REVOIR est une recommandation non appliquee, a trancher en revue.
# =====================================================================

[PARAM]

PROFILE_NAME = TURTLE-LORA
# Le nom de modele contient LORA : le verificateur applique alors les regles
# propres au LoRa (Caipirina portait « LinkIt V4 »).
DEVICE_MODEL = LinkIt-v4-LoRa

# --- Emission (service LoRa, parametres ARGOS_) -----------------------
ARGOS_MODE = SURFACING_BURST
ARGOS_TX_REPETITION = 30
ARGOS_NTRY_PER_MESSAGE = 3
ARGOS_DEPTH_PILE = 1
ARGOS_TX_JITTER_EN = 0
SURFACING_BURST_INITIAL_INTERVAL = 5
SURFACING_BURST_STEP = 5
SURFACING_BURST_MAX_INTERVAL = 60
SURFACING_BURST_MAX_MSG = 0

# --- LoRa -------------------------------------------------------------
# 0 = ABP : les cles de session sont posees a la main, pas de jointure.
LORA_NJM = 0
LORA_BAND = 4
LORA_CLASS = 0
LORA_DR = 3
LORA_ADR = 0
LORA_TXP = 0
LORA_CFM = 0
LORA_FPORT = 2
LORA_LP_MODE = 1

# --- GNSS -------------------------------------------------------------
GNSS_ENABLE = 1
GNSS_DELTATIME_ACQ = 30
GNSS_TRIGGER_ON_SURFACED = 1
GNSS_TRIGGER_ON_AXL_WAKEUP = 0
GNSS_TRIGGER_COLD_START_ON_SURFACED = 0
# A REVOIR : un demarrage a froid demande ~27-32 s (guide GPS, partie C) ;
# a 30 s il aboutit rarement, la balise vit alors de demarrages a chaud.
GNSS_ACQ_TIMEOUT = 30
GNSS_COLD_ACQ_TIMEOUT = 30
GNSS_NTRY = 3
GNSS_COLD_START_RETRY_PERIOD = 10
GNSS_SESSION_SINGLE_FIX = 0
GNSS_MIN_NUM_FIXES = 1
GNSS_FIX_MODE = 2D
GNSS_DYN_MODEL = SEA
GNSS_HDOPFILT_ENABLE = 0
GNSS_HACCFILT_ENABLE = 0
GNSS_MIN_CNO = 10
GNSS_MIN_ELEVATION = 10
# CORRIGE : 15 -> 7 (GPS, Galileo, GLONASS), comme les modeles tortue (b4b1f718).
# Sur le M10, BeiDou B1C desactive AssistNow, que les deux lignes suivantes
# activent : sur une remontee de quelques dizaines de secondes, c est
# l assistance qui decide entre un fix et aucun.
GNSS_CONSTELLATION_MASK = 7
GNSS_ASSISTNOW_EN = 1
GNSS_ASSISTNOW_OFFLINE_EN = 1
GNSS_ANO_STALE_DAYS = 35
# GNSS_ASSISTNOW_ORBIT_MAX_ERR pour le Config Tool, GNSS_ORBMAXERR pour le firmware.
GNSS_ORBIT_MAX_ERROR = 500
GNSS_REUSE_FIX_MAX_AGE_S = 86400
# CORRIGE : jamais coupe (4294967295) -> 1800 s, comme turtle_argos_surface.cfg
# et turtle_cloudlocate.cfg. Decision du 09/10/2026 : pas de rail GNSS
# permanent dans un modele tant que sa consommation n a pas ete mesuree au
# PPK sur une vraie cellule. Le defaut du firmware LinkIt, lui, est jamais
# coupe : omettre la ligne reviendrait a l activer.
GNSS_DEEP_IDLE_AFTER_OFF_S = 1800

# --- CloudLocate ------------------------------------------------------
# 2 = MEAS50 : le plus precis, LoRa seulement (il ne tient pas dans une trame
# Argos). Le sol ne voit que ce format : verifier que la chaine de traitement
# l attend.
GNSS_FASTLOC_MODE = 2
GNSS_CLOUDLOCATE_FORMAT = 2
GNSS_CLOUDLOCATE_ALWAYS = 1
GNSS_CLOUDLOCATE_ONLY = 0

# --- Immersion (SWS) --------------------------------------------------
UW_ENABLE = 1
UW_DRY_TIME_BEFORE_TX = 0
UW_WET_SAMPLING = 0.5
UW_DRY_SAMPLING = 5
UNDERWATER_DETECT_THRESH = 1.1
UW_MAX_SAMPLES = 1
UW_MIN_DRY_SAMPLES = 1
UW_SAMPLE_GAP = 1000
# Delai de lecture du SWS : aux defauts du firmware (depart 1000 us, bornes
# 200-10000 us), comme dans les autres modeles tortue (decision du 27/10/2026 :
# ce sont des parametres de deploiement). Caipirina, comme toute la flotte
# YanaRiba, tournait avec UW_PIN_SAMPLE_DELAY_US = 500, SWS_DELAY_MIN = 200 et
# SWS_DELAY_MAX = 1000.
SWS_ANALOG_HYSTERESIS = 4
SWS_ANALOG_CALIB_INTERVAL = 3600
UW_MAX_DIVE_TIME = 7200
UW_MIN_SURFACE_TIME = 5
UW_DIVE_MODE_ENABLE = 0
MIN_SURFACE_CYCLE_INTERVAL = 300
COOLDOWN_TRIGGER_MODE = 2

# --- Coupe sur cette balise -------------------------------------------
# A REVOIR : pas de profil basse batterie, donc pas d extinction sur batterie
# critique par ce chemin. Sur une tortue qu on ne recupere pas, a trancher.
LB_EN = 0
# Caipirina portait HAULED_IDLE_THRESHOLD_H = 1, sans effet echouage coupe ;
# le seuil reste a son defaut, large (decision du 29/10/2026).
HAULED_DETECT_EN = 0
RATE_LIMIT_EN = 0
ZONE_ENABLE_OUT_OF_ZONE_DETECTION_MODE = 0

# --- Divers -----------------------------------------------------------
LED_MODE = 24HRS
DEBUG_OUTPUT_MODE = NONE
