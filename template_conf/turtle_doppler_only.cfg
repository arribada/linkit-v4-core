# =====================================================================
#  Tortue marine — Doppler seul, sans GNSS
# =====================================================================
#  Le deploiement le plus econome: aucune acquisition GNSS, le segment sol
#  reconstruit la position par effet Doppler. On echange la precision (quelques
#  kilometres) contre une autonomie qui se compte en annees.
#
#  Le risque propre a cette configuration: RIEN ne reveille la balise. Pas de
#  fix, pas d emersion si le SWS est absent. Un refroidissement ou un verrou
#  sans echeance la fait taire DEFINITIVEMENT, et c est indiscernable d une
#  balise perdue. Les reglages ci-dessous evitent tous les pieges connus.
# =====================================================================

[PARAM]

# --- Identite (a provisionner, ces valeurs sont des exemples) ---
PROFILE_NAME = TURTLE-DOPPLER
DEVICE_MODEL = LinkIt-v4-KIM2

# --- Emission ---------------------------------------------------------
# DOPPLER: charge minimale, aucune position embarquee.
ARGOS_MODE = DOPPLER
# 90 s: compromis usuel entre chances de captation et budget batterie.
ARGOS_TX_REPETITION = 90
# 0 = repetitions illimitees tant que l entree est eligible. La pile de
# profondeur reste a 1: en Doppler il n y a pas de position a empiler.
ARGOS_NTRY_PER_MESSAGE = 0
ARGOS_DEPTH_PILE = 1
# FFFFFF = les 24 heures autorisees. Bit 23 = heure 0 UTC. PyLinkit lit ce
# parametre en HEXADECIMAL: ecrire 16777215 donne 0x16777215, refuse par la
# balise, et le masque en place ne change pas.
# ATTENTION: un masque a 000000 rend la balise MUETTE. Le firmware le signale
# desormais, mais ne le posez jamais volontairement.
ARGOS_DUTY_CYCLE = FFFFFF
ARGOS_TX_JITTER_EN = 1
ARGOS_ADAPTIVE_MODULATION = 0

# --- GNSS: eteint -----------------------------------------------------
GNSS_ENABLE = 0

# --- Immersion --------------------------------------------------------
# Le SWS reste ACTIF: c est lui qui evite d emettre sous l eau, ou l onde ne
# passe pas. Sans lui, la balise gaspille son budget a chaque plongee.
UW_ENABLE = 1
UW_DRY_TIME_BEFORE_TX = 10
# 0 = pas de refroidissement entre cycles. En Doppler seul, un refroidissement
# sans source de reveil est le chemin le plus court vers le silence definitif.
MIN_SURFACE_CYCLE_INTERVAL = 0

# --- Batterie ---------------------------------------------------------
LB_EN = 1
LB_THRESHOLD = 10
LB_CRITICAL_THRESH = 5
# En basse batterie on ralentit sans changer de nature: Doppler, plus lent.
LB_ARGOS_MODE = DOPPLER
LB_ARGOS_DEPTH_PILE = 1
LB_ARGOS_TX_REPETITION = 600
LB_GNSS_EN = 0

# --- Ce qu on n utilise pas ------------------------------------------
SAT_PREPASS_EN = 0
ARGOS_RX_EN = 0
RATE_LIMIT_EN = 0
MOORED_DETECT_EN = 0
HAULED_DETECT_EN = 0
ZONE_ENABLE_OUT_OF_ZONE_DETECTION_MODE = 0
# OFF: une LED visible sur un animal attire l attention et consomme.
LED_MODE = OFF
