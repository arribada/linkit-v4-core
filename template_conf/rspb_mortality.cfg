# =====================================================================
#  RSPB — oiseau, detection de mortalite (carte RSPB, SMD en AT)
# =====================================================================
#  Projet : RSPB Mortality. Build : ./scripts/build_rspb.sh.
#
#  SOURCE : le template de production « RSPB Mortality V2 » (plateforme,
#  modifie le 11/08/2026, ecrit depuis un firmware v4.1.10), extrait le
#  29/10/2026. Les valeurs sont les siennes, traduites dans la langue de
#  PyLinkit (le Config Tool ecrit des codes fil et des secondes, PyLinkit
#  des noms et des minutes : voir README.md). Aucune valeur n a ete changee.
#  Retire du template de production :
#    - l etat et l identite de la carte (compteurs, tension, DECID, cles) :
#      ils ne se reglent pas, ou se provisionnent carte par carte ;
#    - les familles sans effet dans ce profil : zone (detection hors zone
#      coupee), immersion (UW_ENABLE = 0), salve d emersion (mode LEGACY),
#      reception Argos et prepasse (ARGOS_RX_EN = 0, pas de PASS_PREDICTION),
#      emission de certification (CERT_TX_ENABLE = 0), GNSS de basse batterie
#      (LB_GNSS_EN = 0), masques horaires (lus en DUTY_CYCLE seulement).
#  Les parametres ajoutes depuis la v4.1.10 restent a leur defaut.
#
#  PREREQUIS DE DEPLOIEMENT, pas des parametres :
#    - ARGOS_DECID / ARGOS_SECKEY / ARGOS_RADIOCONF : propres a chaque carte,
#      a provisionner a part (et a relire : SATVF, puis STATR ART12 = 0) ;
#    - WAKEUP_PERIOD doit etre la periode reelle du TPL5111, fixee par sa
#      resistance : c est elle qui fait avancer l heure entre deux reveils.
#
#  A REVOIR est une recommandation non appliquee, a trancher en revue.
# =====================================================================

[PARAM]

PROFILE_NAME = RSPB Mortality V2
DEVICE_MODEL = RSPB

# --- Cycle de reveil (TPL5111) ----------------------------------------
# Un reveil du TPL5111 sur BOOT_COUNTER_MODULO fait une session, les autres
# recoupent aussitot : ici une session toutes les 5 h.
WAKEUP_PERIOD = 3600
BOOT_COUNTER_MODULO = 5
# Une session dure au plus SHUTDOWN_TIMER s...
SHUTDOWN_TIMER = 600
# ... et se coupe des la 5e emission. ARGOS_NTRY_PER_MESSAGE doit valoir au
# moins SHUTDOWN_NTIME_SAT : un seul fix par session (la pile vit en RAM et
# meurt a la coupure), donc avec moins de repetitions que de 5 la coupure
# anticipee ne se declenche jamais et la session va jusqu a SHUTDOWN_TIMER.
SHUTDOWN_NTIME_SAT = 5
RSPB_PACKET_FORMAT = RSPB_LONG

# --- Mortalite --------------------------------------------------------
MORTALITY_EN = 1
MORTALITY_CONFIRM_DAYS = 3
# 0 = le cycle de reveil ne change pas quand la mortalite est confirmee.
MORTALITY_DUTY_CYCLE_MODULO = 0

# --- Argos ------------------------------------------------------------
ARGOS_MODE = LEGACY
ARGOS_TX_REPETITION = 90
ARGOS_NTRY_PER_MESSAGE = 5
ARGOS_DEPTH_PILE = 1
ARGOS_TIME_SYNC_BURST_EN = 1
ARGOS_TX_JITTER_EN = 1
ARGOS_RX_EN = 0
ARGOS_TCXO_WARMUP_TIME = 2
ARGOS_ADAPTIVE_MODULATION = 0
CERT_TX_ENABLE = 0
SMD_LPM_MODE = 1
SMD_DEGRADED_MODE = 0

# --- GNSS -------------------------------------------------------------
GNSS_ENABLE = 1
GNSS_DELTATIME_ACQ = 30
GNSS_ACQ_TIMEOUT = 180
GNSS_COLD_ACQ_TIMEOUT = 360
GNSS_NTRY = 3
GNSS_COLD_START_RETRY_PERIOD = 120
GNSS_COLD_START_AFTER_NTRY = 0
GNSS_SESSION_SINGLE_FIX = 1
GNSS_MIN_NUM_FIXES = 1
GNSS_FIX_MODE = AUTO
GNSS_DYN_MODEL = AIRBORNE_1G
GNSS_HDOPFILT_ENABLE = 1
GNSS_HDOPFILT_THR = 4
GNSS_HACCFILT_ENABLE = 1
GNSS_HACCFILT_THR = 200
GNSS_MIN_CNO = 10
GNSS_MIN_ELEVATION = 10
# A REVOIR : 15 inclut BeiDou, et sur le M10 BeiDou B1C desactive AssistNow
# (u-blox UBX-22001426 § 3.1.4), que les deux lignes suivantes activent. Le
# rail GNSS est coupe a chaque reveil (GNSS_DEEP_IDLE_AFTER_OFF_S = 0, et le
# TPL5111 coupe tout) : chaque session repart sans ephemerides, et c est
# precisement l assistance qui la raccourcit. Les modeles tortue sont passes
# a 7 (GPS, Galileo, GLONASS) pour cette raison ; jamais mesure sur RSPB.
GNSS_CONSTELLATION_MASK = 15
GNSS_ASSISTNOW_EN = 1
GNSS_ASSISTNOW_OFFLINE_EN = 1
GNSS_ANO_STALE_DAYS = 34
# Le Config Tool l appelle GNSS_ASSISTNOW_ORBIT_MAX_ERR, nom que ni PyLinkit ni
# le firmware (GNSS_ORBMAXERR) ne connaissent.
GNSS_ORBIT_MAX_ERROR = 300
GNSS_REUSE_FIX_MAX_AGE_S = 86400
GNSS_FASTLOC_MODE = 0
GNSS_DEEP_IDLE_AFTER_OFF_S = 0
GNSS_TRIGGER_ON_SURFACED = 0
GNSS_TRIGGER_ON_AXL_WAKEUP = 0
GNSS_TRIGGER_COLD_START_ON_SURFACED = 0

# --- Batterie faible --------------------------------------------------
LB_EN = 1
LB_THRESHOLD = 10
LB_CRITICAL_THRESH = 2
# En basse batterie : Doppler seul, sans GNSS, coupure des la 3e emission
# (LB_NTRY_PER_MESSAGE = LB_SHUTDOWN_NTIME_SAT, meme regle qu au-dessus).
LB_ARGOS_MODE = DOPPLER
LB_ARGOS_TX_REPETITION = 180
LB_NTRY_PER_MESSAGE = 3
LB_SHUTDOWN_NTIME_SAT = 3
LB_ARGOS_DEPTH_PILE = 1
LB_GNSS_EN = 0

# --- Accelerometre (activite, pour la mortalite) ----------------------
# Pas de reveil sur mouvement (seuil 0) : l accelerometre est echantillonne
# toutes les 120 s et sa moyenne part dans la trame.
AXL_SENSOR_ENABLE = 1
AXL_SENSOR_PERIODIC = 120
AXL_SENSOR_WAKEUP_THRESH = 0
AXL_SENSOR_WAKEUP_SAMPLES = 0
AXL_SENSOR_MEASUREMENT_RANGE = 4G
AXL_SENSOR_POWER_MODE = 0
AXL_FIFO_ENABLE = 0
AXL_SENSOR_ENABLE_TX_MODE = MEAN
AXL_SENSOR_ENABLE_TX_MAX_SAMPLES = 10
AXL_SENSOR_ENABLE_TX_SAMPLE_PERIOD = 5000

# --- Thermistance et pression -----------------------------------------
THERMISTOR_SENSOR_ENABLE = 1
THERMISTOR_SENSOR_PERIODIC = 120
THERMISTOR_SENSOR_WAKEUP_THRESH = 0
THERMISTOR_SENSOR_WAKEUP_SAMPLES = 0
THERMISTOR_SENSOR_ENABLE_TX_MODE = MEAN
THERMISTOR_SENSOR_ENABLE_TX_MAX_SAMPLES = 10
THERMISTOR_SENSOR_ENABLE_TX_SAMPLE_PERIOD = 5000
PRESSURE_SENSOR_ENABLE = 1
PRESSURE_SENSOR_PERIODIC = 120
PRESSURE_SENSOR_LOGGING_MODE = ALWAYS
PRESSURE_SENSOR_FULL_SCALE = 1260
PRESSURE_SENSOR_ENABLE_TX_MODE = MEAN
PRESSURE_SENSOR_ENABLE_TX_MAX_SAMPLES = 10
PRESSURE_SENSOR_ENABLE_TX_SAMPLE_PERIOD = 5000

# --- Ni immersion, ni echouage, ni zone, ni limiteur ------------------
UW_ENABLE = 0
# A 0 explicitement : non nul avec UW_ENABLE = 0, le firmware emet un WARN au
# demarrage pour un refroidissement qui ne peut pas s appliquer (defaut 2700).
MIN_SURFACE_CYCLE_INTERVAL = 0
HAULED_DETECT_EN = 0
RATE_LIMIT_EN = 0
ZONE_ENABLE_OUT_OF_ZONE_DETECTION_MODE = 0

# --- Divers -----------------------------------------------------------
LED_MODE = OFF
# Sans effet sur un build Release (NDEBUG force NONE).
DEBUG_OUTPUT_MODE = UART
