# =====================================================================
#  RSPB / Chypre — traceur embarque sur bateau
# =====================================================================
#  Projet mortalite aviaire: le bateau est suivi pour rapporter ses sorties.
#  Un bateau passe l essentiel de son temps a quai. Suivre un bateau amarre
#  avec la cadence d un bateau en route revient a payer une acquisition GNSS
#  et une emission pour repeter la meme position pendant des jours.
#
#  C est exactement ce que resout la detection MOORED (MRP00..08): tant que le
#  classifieur estime le bateau immobile, MOORED_* SE SUBSTITUE a la periode
#  GNSS, a l intervalle d emission et a l activation du GNSS. Des que
#  l accelerometre ou un fix montre un deplacement, la cadence nominale revient.
#
#  CIBLE: build RSPB (nRF52840 + SMD). Les cles marquees [RSPB] dependent de
#  drapeaux de compilation (HAS_BOARD_RSPB, HAS_EXTERNAL_WAKEUP,
#  ENABLE_MORTALITY_SENSOR). Poussees sur un build LinkIt/KIM2 elles sont
#  rapportees comme non implementees et ignorees — sans casse, mais sans effet.
# =====================================================================

[PARAM]

PROFILE_NAME = RSPB-CYPRUS-BOAT
DEVICE_MODEL = RSPB-v4-SMD

# --- Emission nominale (bateau en route) ------------------------------
# LEGACY: cadence reguliere. Le bateau navigue de jour, sur des sorties
# courtes: la prediction de passage ferait manquer des trajets entiers.
ARGOS_MODE = LEGACY
ARGOS_TX_REPETITION = 120
ARGOS_NTRY_PER_MESSAGE = 0
# 4 positions par paquet: une sortie reste tracee meme si des passages
# satellite sont manques.
ARGOS_DEPTH_PILE = 4
ARGOS_DUTY_CYCLE = FFFFFF
ARGOS_TX_JITTER_EN = 1
ARGOS_ADAPTIVE_MODULATION = 1

# --- Detection "a quai" ----------------------------------------------
MOORED_DETECT_EN = 1
# 150 m: un bateau evite sur son corps-mort. En dessous de 10 m (plancher du
# parametre, et du service), le bruit GNSS seul se lit comme un deplacement et
# le classifieur ne se stabilise jamais.
MOORED_RADIUS_M = 150
# 3 fixes consecutifs dans le rayon avant de declarer l immobilite.
MOORED_ENTER_FIXES = 3
# 2 evenements de mouvement pour en sortir: un seul coup de houle ne suffit pas.
MOORED_EXIT_EVENTS = 2
# 1800 s d anti-rebond apres un reveil accelerometre. A 0 la protection
# disparait et chaque vague coute une acquisition GNSS — soit precisement la
# depense que cette fonction existe pour eviter.
MOORED_AXL_HOLDOFF_S = 1800
# 360 minutes = 6 h. PyLinkit prend des MINUTES; les valeurs offertes sont
# 1 2 5 10 15 20 30 45 60 120 180 240 360 720 1440.
MOORED_DLOC = 360
# 6 h entre deux emissions a quai. Ce parametre depasse volontairement le
# plafond d ARGOS_TX_REPETITION (1200 s); son propre plafond de 86400 s est
# structurel: une periode superieure a 24 h fait echouer la recherche de creneau
# et n emet plus rien du tout.
MOORED_TR_NOM = 21600
# On garde le GNSS a quai. A 0, l accelerometre devient le SEUL moyen de sortir
# de l etat amarre: un bateau remorque, ou qui derive sur un mouillage rompu,
# continuerait de rapporter la position de son ancien coffre.
MOORED_GNSS_EN = 1

# --- Accelerometre (source du reveil) ---------------------------------
AXL_SENSOR_ENABLE = 1
# 0.5 g au-dessus du repos: le moteur et le sillage franchissent ce seuil, le
# clapot a quai non.
AXL_SENSOR_WAKEUP_THRESH = 0.5
AXL_SENSOR_WAKEUP_SAMPLES = 5
# 2G: la meilleure resolution, suffisante pour un bateau. (2G 4G 8G 16G.)
AXL_SENSOR_MEASUREMENT_RANGE = 2G
GNSS_TRIGGER_ON_AXL_WAKEUP = 1

# --- GNSS -------------------------------------------------------------
GNSS_ENABLE = 1
# 5 minutes en route: la cadence qui donne une trace exploitable d une
# sortie de peche. (Minutes, pas un code.)
GNSS_DELTATIME_ACQ = 5
GNSS_ACQ_TIMEOUT = 120
GNSS_COLD_ACQ_TIMEOUT = 300
GNSS_SESSION_SINGLE_FIX = 1
GNSS_MIN_NUM_FIXES = 1
GNSS_NTRY = 3
GNSS_HACCFILT_ENABLE = 1
GNSS_HACCFILT_THR = 50
GNSS_HDOPFILT_ENABLE = 1
GNSS_HDOPFILT_THR = 5
# 15 = GPS + Galileo + GLONASS + BeiDou. Bits: 0=GPS 1=GAL 2=GLO
# 3=BDS 4=QZSS 5=SBAS. Un masque plus etroit allonge le temps de fix.
GNSS_CONSTELLATION_MASK = 15
GNSS_FIX_MODE = AUTO
# SEA: modele adapte a un bateau.
GNSS_DYN_MODEL = SEA
GNSS_MIN_CNO = 15
GNSS_MIN_ELEVATION = 5
GNSS_ASSISTNOW_EN = 1
GNSS_ASSISTNOW_OFFLINE_EN = 1
GNSS_ANO_STALE_DAYS = 7
# Un fix de moins de 10 min est reutilise plutot que de rallumer le recepteur.
GNSS_REUSE_FIX_MAX_AGE_S = 600

# --- Pas d immersion --------------------------------------------------
# Le boitier est sur le pont: l electrode SWS ne verrait que des embruns, et
# chaque faux positif bloquerait une emission.
UW_ENABLE = 0
UW_DRY_TIME_BEFORE_TX = 0
MIN_SURFACE_CYCLE_INTERVAL = 0

# --- Reveil externe TPL5111 [RSPB] ------------------------------------
# 2 = le nRF s allume un reveil sur deux. Un modulo de 1 eteindrait l appareil
# a presque chaque reveil; le plancher du parametre est 2 pour cette raison.
BOOT_COUNTER_MODULO = 2
WAKEUP_PERIOD = 3600

# --- Format de paquet [RSPB] ------------------------------------------
RSPB_PACKET_FORMAT = RSPB_SHORT

# --- Detection de mortalite [RSPB]: hors sujet ici --------------------
# MORTALITY_* concerne la balise posee sur l OISEAU, pas le traceur du bateau.
# Explicitement desactivee pour qu un modulo de mortalite ne vienne jamais
# modifier la cadence de ce boitier.
MORTALITY_EN = 0
MORTALITY_DUTY_CYCLE_MODULO = 0

# --- Batterie ---------------------------------------------------------
LB_EN = 1
LB_THRESHOLD = 20
LB_CRITICAL_THRESH = 5
# En basse batterie on reste en LEGACY mais sans GNSS: le Doppler suffit a
# savoir si le bateau est sorti.
LB_ARGOS_MODE = LEGACY
LB_GNSS_EN = 0
LB_ARGOS_DEPTH_PILE = 1
LB_ARGOS_TX_REPETITION = 1200

# --- Garde-fou emission ----------------------------------------------
# 30 emissions par heure au maximum: borne la casse si la detection MOORED est
# mal reglee et que le bateau est vu "en route" en permanence.
RATE_LIMIT_EN = 1
RATE_LIMIT_WINDOW_S = 3600
RATE_LIMIT_MAX_TX = 30

SAT_PREPASS_EN = 0
ARGOS_RX_EN = 0
HAULED_DETECT_EN = 0
ZONE_ENABLE_OUT_OF_ZONE_DETECTION_MODE = 0
# 24HRS: la LED sert a valider la pose a bord, puis s efface.
LED_MODE = 24HRS
