name: Tests

# Runs the host (x86 Linux) test suites:
#  - Unit tests       (TrackerTests, excluding the SWS group)
#  - SWS tests        (TrackerTests -g SWSAnalog and -g SWSAnalogFlash)
#  - Turtle simulation (TurtleSimulation, generates an HTML report)
#
# Triggers:
#  - push to main
#  - pull_request targeting main
#  - schedule, nightly: the only thing it adds is the sws-longrun job, which
#    costs an hour and gates nothing (see that job)
#  - workflow_dispatch (manual run from the Actions tab)

env:
  # Opt every JavaScript action into Node 24 to silence the Node 20
  # deprecation warning (Node 20 is removed from runners in Sept 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 02:17 UTC. Off the hour on purpose: scheduled runs queue behind every
    # other repository that picked a round number.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  # The scheduled run needs a group of its own. A `schedule` event carries
  # github.ref = refs/heads/main, the same value a push to main carries, so one
  # ref-keyed group plus cancel-in-progress meant a push to main killed the
  # two-hour sws-longrun job, and a nightly starting killed an in-flight push
  # run. Only the push and pull_request paths want to be superseded.
  group: tests-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build the host test binaries once, share them with the test jobs as an
  # artifact. Avoids rebuilding the same C++ for each test group.
  # ---------------------------------------------------------------------------
  build:
    name: Build host test binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build g++

      - name: Configure
        run: |
          mkdir -p tests/build
          cd tests/build
          cmake -GNinja ..

      # TrackerTestsCyprus is a declared target that CI never built, so the two
      # Cyprus-only flags it exists to cover (LORA_MOTION_EXT, LORA_LINKCHECK)
      # were compiled by hand or not at all. It is built AND run below.
      #
      # RSPBSimulation is compiled but not run. It has its own source list in
      # tests/CMakeLists.txt (39 of its 43 sources are shared with the other two
      # targets, but the list is maintained separately), so leaving it out of CI
      # let a stale list pass here and fail on the first local RSPB build.
      - name: Compile TrackerTests + TrackerTestsCyprus + TurtleSimulation + RSPBSimulation
        run: ninja -C tests/build TrackerTests TrackerTestsCyprus TurtleSimulation RSPBSimulation

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-binaries
          path: |
            tests/build/TrackerTests
            tests/build/TurtleSimulation
            tests/build/TrackerTestsCyprus
            tests/build/RSPBSimulation
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Formatting, on the lines a pull request touches -- never on the whole tree.
  # A file that nobody edits can never turn the build red; the day someone does
  # edit it, bringing it in line is free.
  #
  # The version is pinned on purpose: two clang-format majors do not agree, and
  # apt ships 14 while this is 23.1.0. Use the same pip package locally:
  #     pip3 install --user clang-format==23.1.0
  # ---------------------------------------------------------------------------
  format:
    name: Format (changed files only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: pip3 install --quiet clang-format==23.1.0

      - name: clang-format the diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only --diff-filter=ACM                       origin/${{ github.base_ref }}...HEAD                     | grep -E '\.(c|h|cpp|hpp)$'                     | grep -vE '^(libraries/|ports/nrf52840/(drivers|bsp|bootloader)/)'                     | grep -vE '(bma400\.[ch]$|bma400_defs\.h$|stc311x_|Generic_I2C\.|heap_4\.c$|tinyfsm\.hpp$|base64\.hpp$)'                     || true)
          if [ -z "$CHANGED" ]; then echo "No first-party C/C++ changed."; exit 0; fi
          echo "$CHANGED"
          FAIL=0
          for f in $CHANGED; do clang-format --dry-run -Werror "$f" || FAIL=1; done
          if [ $FAIL -ne 0 ]; then
            echo ""
            echo "Fix with:  clang-format -i $CHANGED"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Static consistency checks. They run in seconds, need nothing but python3,
  # and are green on main today -- they exist to keep it that way.
  # ---------------------------------------------------------------------------
  consistency:
    name: Consistency checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The three DTE parameter tables are aligned by index across three files.
      # Only one of them has a compile-time guard; this is the other two.
      - name: Parameter tables in sync
        run: python3 scripts/check_param_tables.py

      # ARGOS_CACHED_MODULATION (SMP01) has one writer; a direct write_param()
      # would skip the master-modulation bookkeeping (ART13/ART14).
      - name: Cached modulation has a single writer
        run: python3 tools/check_cached_modulation_writes.py

      # Catches READMEs that point at files which were renamed or deleted.
      - name: Documentation links resolve
        run: python3 scripts/check_doc_links.py

      # The one code path that powers a sealed tag down. It existed in two
      # copies that had already diverged in the field; there is one now, and no
      # host test can see whether the services still call it -- is_lb hangs off
      # a cached flag the test double never refreshes.
      - name: Every TX service calls the battery guard
        run: python3 tools/check_battery_guard_callers.py

      # A ratchet on the CCN of each function, not on the number of warnings:
      # splitting handle_line() took its worst function from 118 to 12 and the
      # file from 4 warnings to 8, so a warning-count gate would have rejected
      # the change that fixed the problem.
      - name: No function got more complex
        run: |
          python3 -m pip install --quiet lizard==1.24.0
          python3 tools/check_complexity_ratchet.py

  # ---------------------------------------------------------------------------
  # Unit tests — the fast suite, runs everything except the SWS group.
  # `-p` runs each test in its own subprocess (defends against memory
  # corruption between tests, see scripts/run_unit_tests.sh).
  # `-xg SWS` excludes both SWSAnalog and SWSAnalogFlash groups (long-running).
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-binaries
          path: tests/build

      - name: Make binaries executable
        run: chmod +x tests/build/TrackerTests tests/build/TrackerTestsCyprus tests/build/TurtleSimulation

      - name: Run unit tests
        working-directory: tests
        run: |
          ln -sf ../data build/data
          mkdir -p reports
          ./build/TrackerTests -ojunit -p -xg SWS -k unit
          # CppUTest writes cpputest_<group>.xml in the cwd
          mkdir -p reports/unit && mv cpputest_*.xml reports/unit/ 2>/dev/null || true

      # Same sources, compiled with the two Cyprus boat flags. It carries tests
      # the default build cannot reach (the LinkCheck store-and-forward and the
      # MOORED burst window), so compiling it without running it proved only
      # that it links.
      - name: Run unit tests, Cyprus flags
        working-directory: tests
        run: |
          mkdir -p reports/unit-cyprus
          ./build/TrackerTestsCyprus -ojunit -p -xg SWS -k unit-cyprus
          # -k names them cpputest_unit-cyprus_*.xml; matching that prefix
          # rather than cpputest_*.xml keeps this from sweeping up anything
          # the step above failed to move.
          mv cpputest_unit-cyprus_*.xml reports/unit-cyprus/ 2>/dev/null || true

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            tests/reports/unit/*.xml
            tests/reports/unit-cyprus/*.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # SWS tests — long-running underwater simulation tests, run separately
  # from the main unit suite (per scripts/run_unit_tests.sh comment).
  # Covers TEST_GROUP(SWSAnalog) and TEST_GROUP(SWSAnalogFlash).
  # ---------------------------------------------------------------------------
  sws-tests:
    name: SWS tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-binaries
          path: tests/build

      - name: Make binaries executable
        run: chmod +x tests/build/TrackerTests tests/build/TurtleSimulation

      - name: Run SWS tests
        working-directory: tests
        run: |
          ln -sf ../data build/data
          mkdir -p reports/sws
          # Run SWSAnalog and SWSAnalogFlash groups; -p isolates each test
          ./build/TrackerTests -ojunit -p -g SWSAnalog -k sws-analog
          ./build/TrackerTests -ojunit -p -g SWSAnalogFlash -k sws-analog-flash
          # One scenario out of SWSLongRun's 17, and the only one that asserts
          # anything: every other test in that group is named _Documentary and
          # produces its report without a single CHECK. So this line carries the
          # whole gating value of the group, for 226 s instead of 3618.
          #
          # Measured, not estimated: 205-228 s per scenario at 99 % of one core
          # on an idle desktop. The "~40 min" that used to be written here was a
          # guess, and it bought a 75-minute job timeout with negative headroom
          # on a 2-vCPU runner. The other 16 scenarios run nightly, in the
          # sws-longrun job below.
          ./build/TrackerTests -ojunit -p -sg SWSLongRun \
            -sn H45_FixedDelayClean_ControlDetectsSurfacings -k sws-longrun-control
          mv cpputest_*.xml reports/sws/ 2>/dev/null || true

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sws-test-reports
          path: tests/reports/sws/*.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # SWS long run — the 16 documentary scenarios, nightly.
  #
  # NOT on push, and that costs no gating: of SWSLongRun's 17 scenarios exactly
  # one contains a CHECK, and the sws-tests job above runs it on every push. The
  # other 16 are research output -- they simulate 75 days of a deployment and
  # write a report, asserting nothing. Running them per push bought an hour of
  # wall clock, measured, in exchange for nothing a merge could fail on.
  #
  # They still run, because the reports are the point: the fouling scenarios are
  # what refuted the hill-climbing fix, and what showed the field telemetry
  # disagreeing with the simulation. A nightly run keeps producing them.
  # ---------------------------------------------------------------------------
  sws-longrun:
    name: SWS long run (nightly)
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-binaries
          path: tests/build

      - name: Make binaries executable
        run: chmod +x tests/build/TrackerTests

      - name: Run the documentary scenarios
        working-directory: tests
        run: |
          ln -sf ../data build/data
          mkdir -p reports/sws-longrun
          ./build/TrackerTests -ojunit -p -g SWSLongRun -k sws-longrun
          mv cpputest_sws-longrun_*.xml reports/sws-longrun/ 2>/dev/null || true

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sws-longrun-reports
          path: tests/reports/sws-longrun/*.xml
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Turtle simulation — separate executable. Produces an HTML report stored
  # at $TURTLE_REPORT_PATH (see scripts/run_turtle_simulation.sh).
  # ---------------------------------------------------------------------------
  simulation:
    name: Turtle simulation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-binaries
          path: tests/build

      - name: Make binaries executable
        run: chmod +x tests/build/TrackerTests tests/build/TurtleSimulation tests/build/RSPBSimulation

      - name: Run turtle simulation
        working-directory: tests
        env:
          TURTLE_REPORT_PATH: ${{ github.workspace }}/tests/reports/turtle_simulation_${{ github.run_id }}.html
        run: |
          ln -sf ../data build/data
          mkdir -p reports
          ./build/TurtleSimulation -v
          if [ -f "$TURTLE_REPORT_PATH" ]; then
            cp "$TURTLE_REPORT_PATH" reports/turtle_simulation_latest.html
          fi

      # Compiling it already guarded against a stale source list, which is why
      # the step above exists and is documented. Running it is the other half:
      # 10 tests over a simulated RSPB mortality deployment that nothing in CI
      # was exercising.
      - name: Run RSPB simulation
        working-directory: tests
        env:
          # Without this it writes its four artefacts into the working
          # directory. The override needs the directory to already exist.
          RSPB_REPORT_DIR: ${{ github.workspace }}/tests/reports/rspb
        run: |
          mkdir -p reports/rspb
          ./build/RSPBSimulation -v

      - name: Upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turtle-simulation-report
          path: |
            tests/reports/turtle_simulation_*.html
            tests/reports/turtle_simulation_latest.html
            tests/reports/rspb/*
          if-no-files-found: warn
          retention-days: 30
